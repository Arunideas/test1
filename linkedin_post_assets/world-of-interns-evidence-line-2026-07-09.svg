<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Add one evidence line</title>
  <desc id="desc">A World of Interns comparison card showing a project before and after adding a short evidence line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="230" font-size="58" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Add one evidence line</text>
  <text x="80" y="288" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">Make the recruiter's first scan easier to trust.</text>

  <rect x="80" y="365" width="500" height="560" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="620" y="365" width="500" height="560" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <text x="330" y="430" font-size="34" fill="#c0492f" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">BEFORE</text>
  <text x="870" y="430" font-size="34" fill="#2f7d4f" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">AFTER</text>

  <line x1="140" y1="470" x2="520" y2="470" stroke="#d7cfbf" stroke-width="3"/>
  <line x1="680" y1="470" x2="1060" y2="470" stroke="#d7cfbf" stroke-width="3"/>

  <text x="130" y="545" font-size="34" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Expense Tracker App</text>
  <text x="130" y="605" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">React, Firebase, CSS</text>
  <text x="130" y="680" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Still asks the recruiter</text>
  <text x="130" y="722" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">to guess the proof.</text>

  <rect x="130" y="780" width="390" height="74" rx="14" fill="#f3efe7" stroke="#d7cfbf" stroke-width="2"/>
  <text x="325" y="827" font-size="26" fill="#c0492f" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Title + tools only</text>

  <text x="670" y="535" font-size="31" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Built an expense tracker</text>
  <text x="670" y="578" font-size="31" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">for 12 classmates to split</text>
  <text x="670" y="621" font-size="31" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">hostel costs weekly.</text>

  <g font-family="Arial, sans-serif" font-size="27" fill="#23303a">
    <circle cx="690" cy="700" r="15" fill="#0b5cff"/>
    <text x="720" y="709">Problem</text>
    <circle cx="690" cy="760" r="15" fill="#0b5cff"/>
    <text x="720" y="769">User</text>
    <circle cx="690" cy="820" r="15" fill="#0b5cff"/>
    <text x="720" y="829">Proof</text>
    <circle cx="690" cy="880" r="15" fill="#0b5cff"/>
    <text x="720" y="889">Skill fit</text>
  </g>

  <rect x="80" y="975" width="1040" height="82" rx="18" fill="#23303a"/>
  <text x="600" y="1028" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">A small line can reduce a big doubt.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
