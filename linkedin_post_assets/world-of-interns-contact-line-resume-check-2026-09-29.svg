<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Contact line resume check for freshers</title>
  <desc id="desc">Checklist card showing which contact details to keep and remove from a fresher resume header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="235" font-size="44" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Tuesday Resume Review</text>
  <text x="80" y="310" font-size="72" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Check the first line</text>
  <text x="80" y="372" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">before a recruiter checks the rest.</text>

  <rect x="80" y="445" width="500" height="490" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <text x="130" y="515" font-size="34" fill="#2f7d4f" font-weight="800" font-family="Arial, sans-serif">KEEP</text>

  <rect x="130" y="568" width="38" height="38" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M139 588 l11 13 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="190" y="598" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Professional email</text>

  <rect x="130" y="650" width="38" height="38" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M139 670 l11 13 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="190" y="680" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Phone and city</text>

  <rect x="130" y="732" width="38" height="38" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M139 752 l11 13 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="190" y="762" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">LinkedIn profile</text>

  <rect x="130" y="814" width="38" height="38" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M139 834 l11 13 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="190" y="844" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">GitHub / portfolio</text>

  <rect x="620" y="445" width="500" height="490" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <text x="670" y="515" font-size="34" fill="#c0492f" font-weight="800" font-family="Arial, sans-serif">REMOVE</text>

  <line x1="675" y1="572" x2="707" y2="604" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <line x1="707" y1="572" x2="675" y2="604" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <text x="730" y="598" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Full address</text>

  <line x1="675" y1="654" x2="707" y2="686" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <line x1="707" y1="654" x2="675" y2="686" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <text x="730" y="680" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Expired college email</text>

  <line x1="675" y1="736" x2="707" y2="768" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <line x1="707" y1="736" x2="675" y2="768" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <text x="730" y="762" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Broken links</text>

  <line x1="675" y1="818" x2="707" y2="850" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <line x1="707" y1="818" x2="675" y2="850" stroke="#c0492f" stroke-width="6" stroke-linecap="round"/>
  <text x="730" y="844" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Parser-only icons</text>

  <rect x="140" y="990" width="920" height="70" rx="16" fill="#23303a"/>
  <text x="600" y="1036" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">30-second test: open every link from the PDF</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  .  practical, not promotional</text>
</svg>
