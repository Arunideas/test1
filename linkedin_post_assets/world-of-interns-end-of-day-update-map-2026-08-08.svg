<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">4-line daily update</title>
  <desc id="desc">World of Interns checklist card with four prompts: finished, tried, next, and question.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="paperGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paperGrain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="255" font-size="32" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">SATURDAY STUDENT STORY</text>
  <text x="80" y="330" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">4-line daily update</text>
  <text x="80" y="392" font-size="34" fill="#5c6773" font-family="Arial, sans-serif">A small map for progress, blockers, next step, and one question.</text>

  <g transform="translate(80 475)">
    <rect x="0" y="0" width="1040" height="490" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

    <g transform="translate(58 78)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="78" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Finished</text>
      <text x="310" y="0" font-size="32" fill="#5c6773" font-family="Arial, sans-serif">What I completed today.</text>
    </g>

    <g transform="translate(58 188)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="78" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Tried</text>
      <text x="310" y="0" font-size="32" fill="#5c6773" font-family="Arial, sans-serif">What I could not complete yet.</text>
    </g>

    <g transform="translate(58 298)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="78" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Next</text>
      <text x="310" y="0" font-size="32" fill="#5c6773" font-family="Arial, sans-serif">What I will do first tomorrow.</text>
    </g>

    <g transform="translate(58 408)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="78" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Question</text>
      <text x="310" y="0" font-size="32" fill="#5c6773" font-family="Arial, sans-serif">One decision that would unblock me.</text>
    </g>
  </g>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
