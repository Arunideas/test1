<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Project bullet proof check</title>
  <desc id="desc">A World of Interns resume review graphic showing a weak project bullet as a tool list and a stronger project bullet structured as problem, action, and proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#16324f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="150" fill="#f9c76b" opacity="0.24"/>
  <circle cx="120" cy="1050" r="190" fill="#8ecae6" opacity="0.22"/>

  <g transform="translate(96 82)">
    <rect x="0" y="0" width="1008" height="1036" rx="48" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1008" height="1036" rx="48" fill="none" stroke="#dbe7f3" stroke-width="3"/>

    <text x="60" y="86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#126782" letter-spacing="2">WORLD OF INTERNS</text>
    <text x="60" y="150" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="#102a43">Project bullets need proof.</text>
    <text x="60" y="204" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="600" fill="#486581">Do not let your project section become a tool list.</text>

    <g transform="translate(60 270)">
      <rect x="0" y="0" width="888" height="218" rx="30" fill="#fff4f0" stroke="#f4b8a8" stroke-width="3"/>
      <rect x="28" y="32" width="142" height="44" rx="22" fill="#ef476f"/>
      <text x="99" y="62" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">WEAK</text>
      <text x="36" y="124" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#243b53">"Built food delivery app using MERN."</text>
      <text x="36" y="174" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#7b8794">This names tools, but does not prove judgement.</text>
    </g>

    <g transform="translate(60 540)">
      <rect x="0" y="0" width="888" height="318" rx="30" fill="#f0fbf7" stroke="#94d2bd" stroke-width="3"/>
      <rect x="28" y="32" width="178" height="44" rx="22" fill="#0a9396"/>
      <text x="117" y="62" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">STRONGER</text>
      <text x="36" y="124" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#243b53">"Reduced checkout steps from 6 to 3</text>
      <text x="36" y="166" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#243b53">and added order status tracking."</text>

      <g transform="translate(36 214)">
        <rect x="0" y="0" width="238" height="62" rx="18" fill="#ffffff" stroke="#c8e6dd" stroke-width="2"/>
        <text x="119" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#0b7285">PROBLEM</text>
        <text x="282" y="40" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#94a3b8">-></text>
        <rect x="330" y="0" width="208" height="62" rx="18" fill="#ffffff" stroke="#c8e6dd" stroke-width="2"/>
        <text x="434" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#0b7285">ACTION</text>
        <text x="582" y="40" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#94a3b8">-></text>
        <rect x="630" y="0" width="198" height="62" rx="18" fill="#ffffff" stroke="#c8e6dd" stroke-width="2"/>
        <text x="729" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#0b7285">PROOF</text>
      </g>
    </g>

    <g transform="translate(60 905)">
      <rect x="0" y="0" width="888" height="74" rx="24" fill="#102a43"/>
      <text x="444" y="47" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Rewrite one project bullet before your next application.</text>
    </g>
  </g>
</svg>
