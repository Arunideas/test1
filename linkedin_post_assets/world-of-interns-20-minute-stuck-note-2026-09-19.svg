<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">20-minute stuck note checklist</title>
  <desc id="desc">A World of Interns checklist card for interns showing five prompts: task, tried, observed, options, question.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect x="76" y="82" width="1048" height="1036" rx="56" fill="#f1f5f9" stroke="#dbe4ef" stroke-width="3"/>

  <g opacity="0.45">
    <rect x="110" y="920" width="330" height="92" rx="18" fill="#dbe4ef"/>
    <rect x="782" y="170" width="246" height="62" rx="18" fill="#dbe4ef"/>
    <circle cx="1012" cy="944" r="78" fill="#dbe4ef"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="178" y="154" width="844" height="892" rx="38" fill="#ffffff"/>
    <rect x="178" y="154" width="844" height="892" rx="38" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  </g>

  <g transform="translate(230 210)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#0f766e"/>
    <text x="80" y="29" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">INTERN HABIT</text>

    <text x="0" y="112" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#0f172a">20-minute</text>
    <text x="0" y="186" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#0f172a">stuck note</text>
    <text x="0" y="242" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#475569">Before asking for help, make the task clear.</text>

    <line x1="0" y1="298" x2="740" y2="298" stroke="#e2e8f0" stroke-width="4"/>

    <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
      <g transform="translate(0 356)">
        <rect x="0" y="-34" width="46" height="46" rx="12" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
        <path d="M12 -10 L22 1 L35 -19" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="0">Task</text>
        <text x="70" y="42" font-size="24" font-weight="500" fill="#64748b">What was I trying to do?</text>
      </g>
      <g transform="translate(0 464)">
        <rect x="0" y="-34" width="46" height="46" rx="12" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
        <path d="M12 -10 L22 1 L35 -19" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="0">Tried</text>
        <text x="70" y="42" font-size="24" font-weight="500" fill="#64748b">What did I already check?</text>
      </g>
      <g transform="translate(0 572)">
        <rect x="0" y="-34" width="46" height="46" rx="12" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
        <path d="M12 -10 L22 1 L35 -19" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="0">Observed</text>
        <text x="70" y="42" font-size="24" font-weight="500" fill="#64748b">What happened instead?</text>
      </g>
      <g transform="translate(0 680)">
        <rect x="0" y="-34" width="46" height="46" rx="12" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
        <path d="M12 -10 L22 1 L35 -19" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="0">Options</text>
        <text x="70" y="42" font-size="24" font-weight="500" fill="#64748b">Which two paths seem possible?</text>
      </g>
      <g transform="translate(0 788)">
        <rect x="0" y="-34" width="46" height="46" rx="12" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
        <path d="M12 -10 L22 1 L35 -19" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="0">Question</text>
        <text x="70" y="42" font-size="24" font-weight="500" fill="#64748b">What exact answer do I need?</text>
      </g>
    </g>
  </g>

  <g transform="translate(230 1012)">
    <rect x="0" y="0" width="740" height="2" fill="#e2e8f0"/>
    <text x="0" y="54" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f766e">World of Interns</text>
    <text x="278" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#64748b">Make your work visible early.</text>
  </g>
</svg>
