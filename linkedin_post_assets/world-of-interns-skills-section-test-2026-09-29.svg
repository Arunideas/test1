<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">World of Interns skills section test checklist</title>
  <desc id="desc">A checklist card for resume skills sections: relevant to the role, backed by proof, easy to scan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe4"/>
      <stop offset="1" stop-color="#e8dfcf"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paperNoise)" opacity="0.08"/>

  <g>
    <rect x="82" y="78" width="48" height="48" rx="12" fill="#0b5cff"/>
    <text x="106" y="112" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="148" y="112" font-size="28" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <rect x="92" y="200" width="1016" height="790" rx="32" fill="#fbf9f4" stroke="#d6ccb9" stroke-width="3"/>
  <text x="600" y="315" font-size="70" fill="#23303a" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">Skills section test</text>
  <text x="600" y="380" font-size="30" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">Before a recruiter scans your resume</text>

  <g transform="translate(180 490)">
    <circle cx="42" cy="42" r="42" fill="#eaf1ff" stroke="#0b5cff" stroke-width="4"/>
    <path d="M21 43 l15 16 l30 -39" fill="none" stroke="#0b5cff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="36" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Relevant to the role</text>
    <text x="120" y="80" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Keep the skills the job will actually use.</text>
  </g>

  <g transform="translate(180 640)">
    <circle cx="42" cy="42" r="42" fill="#eef7f1" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M21 43 l15 16 l30 -39" fill="none" stroke="#2f7d4f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="36" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Backed by proof</text>
    <text x="120" y="80" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Show projects, internships, or coursework nearby.</text>
  </g>

  <g transform="translate(180 790)">
    <circle cx="42" cy="42" r="42" fill="#fff4ec" stroke="#c0492f" stroke-width="4"/>
    <path d="M21 43 l15 16 l30 -39" fill="none" stroke="#c0492f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="36" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Easy to scan</text>
    <text x="120" y="80" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Short groups beat a wall of keywords.</text>
  </g>

  <line x1="180" y1="925" x2="1020" y2="925" stroke="#d6ccb9" stroke-width="3"/>
  <text x="600" y="1085" font-size="25" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  |  practical, not promotional</text>
</svg>
