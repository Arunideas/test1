<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday night proof point</title>
  <desc id="desc">A World of Interns checklist card reminding students to save one finished task, one lesson, and one proof point before Monday applications.</desc>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <rect x="80" y="80" width="1040" height="1040" rx="52" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>
  <circle cx="1004" cy="188" r="74" fill="#dbeafe"/>
  <circle cx="1004" cy="188" r="40" fill="#2563eb" opacity="0.9"/>
  <path d="M965 190h78" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M1004 151v78" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <text x="140" y="175" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">WORLD OF INTERNS</text>
  <text x="140" y="272" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800">Sunday night</text>
  <text x="140" y="358" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800">proof point</text>
  <text x="140" y="425" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Before Monday applications, save one piece of evidence.</text>

  <rect x="140" y="505" width="920" height="126" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <circle cx="203" cy="568" r="28" fill="#2563eb"/>
  <path d="M190 568l10 10 18-23" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="255" y="559" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Finished</text>
  <text x="255" y="603" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="27">What did you complete that can be shown?</text>

  <rect x="140" y="665" width="920" height="126" rx="28" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/>
  <circle cx="203" cy="728" r="28" fill="#16a34a"/>
  <path d="M190 728l10 10 18-23" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="255" y="719" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Learned</text>
  <text x="255" y="763" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="27">What changed how you work next week?</text>

  <rect x="140" y="825" width="920" height="126" rx="28" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <circle cx="203" cy="888" r="28" fill="#ea580c"/>
  <path d="M190 888l10 10 18-23" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="255" y="879" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Proof saved</text>
  <text x="255" y="923" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="27">Add it to your resume, portfolio, or LinkedIn.</text>

  <line x1="140" y1="1012" x2="1060" y2="1012" stroke="#e2e8f0" stroke-width="3"/>
  <text x="140" y="1073" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Small evidence beats vague responsibility.</text>
  <text x="140" y="1122" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="26">worldofinterns.com</text>
</svg>
