<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">One-minute project explanation</title>
  <desc id="desc">A World of Interns checklist card with three prompts: problem, choice, and result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="238" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">One-minute project</text>
  <text x="80" y="310" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">explanation</text>

  <rect x="80" y="370" width="1040" height="560" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <circle cx="145" cy="465" r="36" fill="#0b5cff"/>
    <text x="145" y="479" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="210" y="456" font-size="38" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Problem</text>
    <text x="210" y="506" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">What were you trying to fix?</text>
  </g>

  <line x1="145" y1="515" x2="145" y2="605" stroke="#d7cfbf" stroke-width="4" stroke-linecap="round"/>

  <g>
    <circle cx="145" cy="655" r="36" fill="#0b5cff"/>
    <text x="145" y="669" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="210" y="646" font-size="38" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Choice</text>
    <text x="210" y="696" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">What decision did you make?</text>
  </g>

  <line x1="145" y1="705" x2="145" y2="795" stroke="#d7cfbf" stroke-width="4" stroke-linecap="round"/>

  <g>
    <circle cx="145" cy="845" r="36" fill="#0b5cff"/>
    <text x="145" y="859" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="210" y="836" font-size="38" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Result</text>
    <text x="210" y="886" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">What changed because of it?</text>
  </g>

  <rect x="120" y="970" width="960" height="76" rx="18" fill="#23303a"/>
  <text x="600" y="1018" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">If a friend can repeat it back, it is clear.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
