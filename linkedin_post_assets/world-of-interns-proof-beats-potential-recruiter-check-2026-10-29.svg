<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Good candidates need proof</title>
  <desc id="desc">A World of Interns recruiter checklist card about making proof easy to scan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="245" font-size="56" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Good candidates</text>
  <text x="80" y="315" font-size="56" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">need proof</text>
  <text x="80" y="380" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">Recruiters trust what they can scan in seconds.</text>

  <rect x="80" y="455" width="1040" height="470" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <g>
      <circle cx="156" cy="550" r="34" fill="#0b5cff"/>
      <text x="156" y="562" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle">1</text>
      <text x="220" y="540" font-size="34" fill="#23303a" font-weight="700">Clear role fit</text>
      <text x="220" y="582" font-size="24" fill="#5c6773">The reader knows what work you want.</text>
    </g>

    <g>
      <circle cx="156" cy="660" r="34" fill="#0b5cff"/>
      <text x="156" y="672" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle">2</text>
      <text x="220" y="650" font-size="34" fill="#23303a" font-weight="700">One specific proof point</text>
      <text x="220" y="692" font-size="24" fill="#5c6773">Project, task, internship, course, or responsibility.</text>
    </g>

    <g>
      <circle cx="156" cy="770" r="34" fill="#0b5cff"/>
      <text x="156" y="782" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle">3</text>
      <text x="220" y="760" font-size="34" fill="#23303a" font-weight="700">One result or change</text>
      <text x="220" y="802" font-size="24" fill="#5c6773">What improved, shipped, reduced, explained, or moved.</text>
    </g>

    <g>
      <circle cx="156" cy="880" r="34" fill="#0b5cff"/>
      <text x="156" y="892" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle">4</text>
      <text x="220" y="870" font-size="34" fill="#23303a" font-weight="700">One next step</text>
      <text x="220" y="912" font-size="24" fill="#5c6773">Portfolio link, project detail, or interview-ready example.</text>
    </g>
  </g>

  <text x="80" y="1018" font-size="30" fill="#c0492f" font-weight="700" font-family="Arial, sans-serif">Potential matters. Proof gets found faster.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
