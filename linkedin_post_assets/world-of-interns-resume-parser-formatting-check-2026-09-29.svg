<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Resume parser formatting check</title>
  <desc id="desc">Before and after resume formatting card showing that a one-column resume parses more cleanly than tables, icons, and text boxes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" class="sans">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" class="sans">World of Interns</text>
  </g>

  <text x="80" y="240" font-size="50" fill="#23303a" font-weight="800" class="serif">Resume parser</text>
  <text x="80" y="302" font-size="50" fill="#23303a" font-weight="800" class="serif">formatting check</text>
  <text x="80" y="360" font-size="28" fill="#5c6773" class="sans">A clean design is useful only if the order stays readable.</text>

  <rect x="80" y="430" width="500" height="550" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="620" y="430" width="500" height="550" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <text x="330" y="500" font-size="30" fill="#c0492f" font-weight="700" text-anchor="middle" class="sans">BEFORE</text>
  <text x="870" y="500" font-size="30" fill="#2f7d4f" font-weight="700" text-anchor="middle" class="sans">AFTER</text>

  <text x="130" y="575" font-size="30" fill="#23303a" font-weight="700" class="serif">Looks neat</text>
  <text x="130" y="638" font-size="26" fill="#5c6773" class="sans">Two columns</text>
  <text x="130" y="696" font-size="26" fill="#5c6773" class="sans">Icons and skill bars</text>
  <text x="130" y="754" font-size="26" fill="#5c6773" class="sans">Text boxes</text>
  <text x="130" y="812" font-size="26" fill="#5c6773" class="sans">Dates drift away</text>

  <line x1="420" y1="610" x2="520" y2="610" stroke="#d7cfbf" stroke-width="12" stroke-linecap="round"/>
  <line x1="420" y1="690" x2="500" y2="690" stroke="#d7cfbf" stroke-width="12" stroke-linecap="round"/>
  <line x1="420" y1="770" x2="530" y2="770" stroke="#d7cfbf" stroke-width="12" stroke-linecap="round"/>

  <text x="670" y="575" font-size="30" fill="#23303a" font-weight="700" class="serif">Parses cleanly</text>
  <text x="670" y="638" font-size="26" fill="#23303a" class="sans">One column</text>
  <text x="670" y="696" font-size="26" fill="#23303a" class="sans">Plain headings</text>
  <text x="670" y="754" font-size="26" fill="#23303a" class="sans">Projects near proof</text>
  <text x="670" y="812" font-size="26" fill="#23303a" class="sans">Dates stay nearby</text>

  <circle cx="1010" cy="630" r="22" fill="none" stroke="#2f7d4f" stroke-width="5"/>
  <path d="M998 630 l10 11 l23 -29" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1010" cy="710" r="22" fill="none" stroke="#2f7d4f" stroke-width="5"/>
  <path d="M998 710 l10 11 l23 -29" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1010" cy="790" r="22" fill="none" stroke="#2f7d4f" stroke-width="5"/>
  <path d="M998 790 l10 11 l23 -29" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="1070" font-size="28" fill="#23303a" font-weight="700" text-anchor="middle" class="serif">Paste the PDF text into a plain note. If the order breaks, fix the format.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" class="sans">worldofinterns.in | practical, not promotional</text>
</svg>
