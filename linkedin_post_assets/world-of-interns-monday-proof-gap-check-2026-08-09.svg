<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Monday proof gap check</title>
  <desc id="desc">A World of Interns checklist card helping students match an internship role with existing evidence and one missing proof point before Monday applications.</desc>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <rect x="76" y="76" width="1048" height="1048" rx="56" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>
  <circle cx="1004" cy="184" r="76" fill="#e0f2fe"/>
  <path d="M968 184h72" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <path d="M1004 148v72" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>

  <text x="136" y="172" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">WORLD OF INTERNS</text>
  <text x="136" y="272" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">Monday proof</text>
  <text x="136" y="356" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">gap check</text>
  <text x="136" y="424" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Before applying, match the role to visible evidence.</text>

  <rect x="136" y="504" width="928" height="112" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <circle cx="198" cy="560" r="28" fill="#2563eb"/>
  <text x="187" y="571" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">1</text>
  <text x="252" y="552" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Role</text>
  <text x="252" y="594" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="26">Which internship are you applying for?</text>

  <rect x="136" y="650" width="928" height="112" rx="28" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/>
  <circle cx="198" cy="706" r="28" fill="#16a34a"/>
  <text x="187" y="717" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">2</text>
  <text x="252" y="698" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Evidence</text>
  <text x="252" y="740" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="26">What work, project, or result can prove fit?</text>

  <rect x="136" y="796" width="928" height="112" rx="28" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <circle cx="198" cy="852" r="28" fill="#ea580c"/>
  <text x="187" y="863" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">3</text>
  <text x="252" y="844" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Missing proof</text>
  <text x="252" y="886" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="26">What one gap can you close this week?</text>

  <rect x="136" y="966" width="928" height="86" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <text x="178" y="1019" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">Same resume everywhere = weaker signal.</text>
  <text x="136" y="1116" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="26">worldofinterns.com</text>
</svg>
