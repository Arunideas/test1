<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday proof ladder</title>
  <desc id="desc">A World of Interns card showing three role requirements matched to visible resume proof before Monday internship applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2b2118" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="224" font-size="30" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">SUNDAY WEEKLY REPORT</text>
  <text x="80" y="312" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Build a proof</text>
  <text x="80" y="392" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">ladder</text>

  <rect x="80" y="472" width="1040" height="500" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>
  <text x="155" y="552" font-size="31" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">ROLE ASKS FOR</text>
  <text x="690" y="552" font-size="31" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">VISIBLE PROOF</text>

  <g stroke="#d7cfbf" stroke-width="4">
    <line x1="600" y1="585" x2="600" y2="890"/>
    <line x1="210" y1="648" x2="990" y2="648"/>
    <line x1="210" y1="748" x2="990" y2="748"/>
    <line x1="210" y1="848" x2="990" y2="848"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="33" fill="#23303a">
    <circle cx="155" cy="632" r="13" fill="#c0492f"/>
    <text x="190" y="644">Skill requirement</text>
    <circle cx="155" cy="732" r="13" fill="#c0492f"/>
    <text x="190" y="744">Project or task</text>
    <circle cx="155" cy="832" r="13" fill="#c0492f"/>
    <text x="190" y="844">Outcome expected</text>

    <rect x="680" y="607" width="36" height="36" rx="8" fill="none" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M689 625 l10 12 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="5" stroke-linecap="round"/>
    <text x="735" y="635">Where you used it</text>

    <rect x="680" y="707" width="36" height="36" rx="8" fill="none" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M689 725 l10 12 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="5" stroke-linecap="round"/>
    <text x="735" y="735">What you built</text>

    <rect x="680" y="807" width="36" height="36" rx="8" fill="none" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M689 825 l10 12 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="5" stroke-linecap="round"/>
    <text x="735" y="835">What changed</text>
  </g>

  <rect x="155" y="910" width="890" height="92" rx="18" fill="#e9f0ff" stroke="#c7d8ff" stroke-width="2"/>
  <text x="600" y="967" font-size="34" fill="#23303a" font-weight="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Move one strong proof line higher.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
