<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Clear writing is a technical skill</title>
  <desc id="desc">World of Interns card showing a five-line clarity checklist for work notes: context, goal, tried, unclear, and next action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e7dfd0"/>
    </linearGradient>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.74" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.035"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#b8ad99" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paper)" opacity="0.22"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="240" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">FRIDAY FUTURE SKILL</text>
  <text x="80" y="330" font-size="72" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Clear writing</text>
  <text x="80" y="415" font-size="72" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">is technical</text>

  <rect x="80" y="500" width="1040" height="455" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#shadow)"/>

  <rect x="130" y="565" width="420" height="310" rx="22" fill="#f4efe6" stroke="#d7cfbf" stroke-width="3"/>
  <text x="170" y="630" font-size="30" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">VAGUE NOTE</text>
  <text x="170" y="700" font-size="34" fill="#23303a" font-family="Arial, sans-serif">I tried it.</text>
  <text x="170" y="758" font-size="34" fill="#23303a" font-family="Arial, sans-serif">It is not working.</text>
  <text x="170" y="816" font-size="34" fill="#23303a" font-family="Arial, sans-serif">Please check.</text>

  <path d="M585 720 h85" stroke="#0b5cff" stroke-width="9" stroke-linecap="round"/>
  <path d="M640 675 l45 45 l-45 45" fill="none" stroke="#0b5cff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="710" y="545" width="360" height="370" rx="22" fill="#ffffff" stroke="#d7cfbf" stroke-width="3"/>
  <text x="750" y="605" font-size="30" fill="#0b5cff" font-weight="800" font-family="Arial, sans-serif">CLEAR WORK NOTE</text>

  <circle cx="760" cy="672" r="12" fill="#0b5cff"/>
  <text x="790" y="682" font-size="31" fill="#23303a" font-family="Arial, sans-serif">Context</text>
  <circle cx="760" cy="728" r="12" fill="#2f7d4f"/>
  <text x="790" y="738" font-size="31" fill="#23303a" font-family="Arial, sans-serif">Goal</text>
  <circle cx="760" cy="784" r="12" fill="#c0492f"/>
  <text x="790" y="794" font-size="31" fill="#23303a" font-family="Arial, sans-serif">What I tried</text>
  <circle cx="760" cy="840" r="12" fill="#23303a"/>
  <text x="790" y="850" font-size="31" fill="#23303a" font-family="Arial, sans-serif">What is unclear</text>
  <circle cx="760" cy="896" r="12" fill="#5c6773"/>
  <text x="790" y="906" font-size="31" fill="#23303a" font-family="Arial, sans-serif">Next action</text>

  <rect x="80" y="995" width="1040" height="72" rx="18" fill="#23303a"/>
  <text x="600" y="1042" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Reduce confusion before you ask for help.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in | practical, not promotional</text>
</svg>
