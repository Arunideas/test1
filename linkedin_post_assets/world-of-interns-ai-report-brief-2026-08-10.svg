<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI report brief checklist</title>
  <desc id="desc">A World of Interns checklist card with four steps for using AI to prepare from a long report before an interview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#23303a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="110" y="190" width="980" height="820" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <rect x="110" y="190" width="980" height="118" rx="28" fill="#e7f0ff"/>
    <rect x="110" y="278" width="980" height="30" fill="#e7f0ff"/>
  </g>

  <text x="160" y="275" font-size="62" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">AI report brief</text>
  <text x="160" y="346" font-size="31" fill="#5c6773" font-family="Arial, sans-serif">Use AI to prepare, then verify the source.</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(160 445)">
      <rect x="0" y="-42" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -18 l13 15 l28 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="-12" font-size="39" fill="#23303a" font-weight="700">Summarize the report</text>
      <text x="76" y="34" font-size="27" fill="#5c6773">Ask for a one-page interview brief.</text>
    </g>

    <g transform="translate(160 585)">
      <rect x="0" y="-42" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -18 l13 15 l28 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="-12" font-size="39" fill="#23303a" font-weight="700">Extract the numbers</text>
      <text x="76" y="34" font-size="27" fill="#5c6773">Revenue, users, dates, hiring signals.</text>
    </g>

    <g transform="translate(160 725)">
      <rect x="0" y="-42" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -18 l13 15 l28 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="-12" font-size="39" fill="#23303a" font-weight="700">Verify before speaking</text>
      <text x="76" y="34" font-size="27" fill="#5c6773">Open the original and check each fact.</text>
    </g>

    <g transform="translate(160 865)">
      <rect x="0" y="-42" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -18 l13 15 l28 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="-12" font-size="39" fill="#23303a" font-weight="700">Prepare 3 questions</text>
      <text x="76" y="34" font-size="27" fill="#5c6773">Show that you read with context.</text>
    </g>
  </g>

  <line x1="160" y1="950" x2="1040" y2="950" stroke="#d7cfbf" stroke-width="3"/>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
