<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Follow up without pressure</title>
  <desc id="desc">World of Interns square card explaining how freshers can follow up with recruiters without pressure by adding role, proof, timing, and a simple question.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#eadfce"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.052"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#23303a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.09"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="230" font-size="28" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif" letter-spacing="2">RECRUITER INSIGHT</text>
  <text x="80" y="326" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Follow up</text>
  <text x="80" y="404" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">without pressure</text>

  <rect x="80" y="474" width="1040" height="484" rx="30" fill="#fbf8f1" stroke="#d8cdbc" stroke-width="3" filter="url(#softShadow)"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(132 552)">
      <circle cx="25" cy="-12" r="25" fill="#dce9ff" stroke="#0b5cff" stroke-width="3"/>
      <text x="25" y="-2" font-size="26" fill="#0b5cff" font-weight="800" text-anchor="middle">1</text>
      <text x="82" y="0" font-size="40" fill="#23303a" font-weight="700">Role</text>
      <text x="82" y="42" font-size="24" fill="#5c6773">Name the exact internship you applied for.</text>
    </g>

    <g transform="translate(132 664)">
      <circle cx="25" cy="-12" r="25" fill="#e8f4ec" stroke="#2f7d4f" stroke-width="3"/>
      <text x="25" y="-2" font-size="26" fill="#2f7d4f" font-weight="800" text-anchor="middle">2</text>
      <text x="82" y="0" font-size="40" fill="#23303a" font-weight="700">Proof</text>
      <text x="82" y="42" font-size="24" fill="#5c6773">Add one relevant project, skill, or result.</text>
    </g>

    <g transform="translate(132 776)">
      <circle cx="25" cy="-12" r="25" fill="#fff0d4" stroke="#b56b00" stroke-width="3"/>
      <text x="25" y="-2" font-size="26" fill="#b56b00" font-weight="800" text-anchor="middle">3</text>
      <text x="82" y="0" font-size="40" fill="#23303a" font-weight="700">Timing</text>
      <text x="82" y="42" font-size="24" fill="#5c6773">Wait long enough for the application to be seen.</text>
    </g>

    <g transform="translate(132 888)">
      <circle cx="25" cy="-12" r="25" fill="#f2e7ff" stroke="#6c4bd8" stroke-width="3"/>
      <text x="25" y="-2" font-size="26" fill="#6c4bd8" font-weight="800" text-anchor="middle">4</text>
      <text x="82" y="0" font-size="40" fill="#23303a" font-weight="700">Question</text>
      <text x="82" y="42" font-size="24" fill="#5c6773">Ask one simple next-step question.</text>
    </g>
  </g>

  <rect x="80" y="1004" width="1040" height="76" rx="19" fill="#23303a" opacity="0.97"/>
  <text x="600" y="1053" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">A useful follow-up gives context, not pressure.</text>

  <text x="600" y="1134" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
