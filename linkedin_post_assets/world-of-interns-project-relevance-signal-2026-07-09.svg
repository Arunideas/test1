<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Project relevance beats project count</title>
  <desc id="desc">World of Interns square card explaining that project relevance is a stronger recruiter signal than project count, with four checklist items: role skill, problem solved, tool used, result shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e8e0d2"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="232" font-size="28" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif" letter-spacing="2">RECRUITER INSIGHT</text>
  <text x="80" y="326" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Project relevance</text>
  <text x="80" y="402" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">beats project count</text>

  <rect x="80" y="480" width="1040" height="456" rx="28" fill="#fbf8f1" stroke="#d6ccb9" stroke-width="3" filter="url(#softShadow)"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(132 554)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Role skill</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">Does the project match the internship work?</text>
    </g>

    <g transform="translate(132 658)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Problem solved</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">Is there a real task behind the project?</text>
    </g>

    <g transform="translate(132 762)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Tool used</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">Can the recruiter see the method quickly?</text>
    </g>

    <g transform="translate(132 866)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Result shown</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">What changed, improved, or was learned?</text>
    </g>
  </g>

  <rect x="80" y="988" width="1040" height="72" rx="18" fill="#23303a" opacity="0.96"/>
  <text x="600" y="1034" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">One clear proof point is easier to trust than a long list.</text>

  <text x="600" y="1132" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
