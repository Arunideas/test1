<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Share the rough draft early</title>
  <desc id="desc">A World of Interns checklist card with four steps for interns: Clarify, Build small, Name doubts, and Ask direction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="270" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Share the rough</text>
  <text x="80" y="340" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">draft early</text>
  <text x="82" y="395" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">A small habit that prevents quiet rework.</text>

  <g>
    <rect x="80" y="486" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 508 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="518" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Clarify the task</text>
  </g>

  <g>
    <rect x="80" y="636" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 658 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="668" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Build a small first version</text>
  </g>

  <g>
    <rect x="80" y="786" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 808 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="818" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Name what feels unsure</text>
  </g>

  <g>
    <rect x="80" y="936" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 958 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="968" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Ask, "Is this direction useful?"</text>
  </g>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
