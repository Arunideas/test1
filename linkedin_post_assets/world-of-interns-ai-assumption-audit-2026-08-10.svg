<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI assumption audit checklist</title>
  <desc id="desc">A World of Interns checklist card with five steps: stated, implied, missing, unclear, and confirm before starting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#e9f5f2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1040" cy="150" r="92" fill="#0f766e" opacity="0.12"/>
  <circle cx="150" cy="1050" r="130" fill="#1e3a8a" opacity="0.10"/>

  <rect x="110" y="120" width="980" height="960" rx="48" fill="#fffdf7" filter="url(#shadow)"/>
  <rect x="110" y="120" width="980" height="16" rx="8" fill="#0f766e"/>

  <text x="170" y="218" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">World of Interns</text>
  <text x="170" y="302" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">AI assumption</text>
  <text x="170" y="386" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">audit</text>
  <text x="170" y="452" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="32">Before starting an internship task, check:</text>

  <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    <g transform="translate(170 535)">
      <circle cx="28" cy="28" r="28" fill="#ccfbf1"/>
      <path d="M16 29l8 9 18-22" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="39">What is clearly stated?</text>
    </g>
    <g transform="translate(170 630)">
      <circle cx="28" cy="28" r="28" fill="#dbeafe"/>
      <path d="M16 29l8 9 18-22" fill="none" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="39">What is only implied?</text>
    </g>
    <g transform="translate(170 725)">
      <circle cx="28" cy="28" r="28" fill="#fef3c7"/>
      <path d="M16 29l8 9 18-22" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="39">What information is missing?</text>
    </g>
    <g transform="translate(170 820)">
      <circle cx="28" cy="28" r="28" fill="#ede9fe"/>
      <path d="M16 29l8 9 18-22" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="39">What could mean two things?</text>
    </g>
    <g transform="translate(170 915)">
      <circle cx="28" cy="28" r="28" fill="#dcfce7"/>
      <path d="M16 29l8 9 18-22" fill="none" stroke="#15803d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="39">What should I confirm first?</text>
    </g>
  </g>

  <rect x="170" y="1012" width="860" height="1" fill="#cbd5e1"/>
  <text x="170" y="1064" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">Use AI to ask better questions, not skip thinking.</text>
</svg>
