<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Read internship postings like shortlist filters</title>
  <desc id="desc">World of Interns checklist card showing three checks before applying to an internship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="246" font-size="54" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Read the internship post</text>
  <text x="80" y="312" font-size="54" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">like a shortlist filter</text>
  <text x="80" y="370" font-size="30" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">3 minutes before you apply</text>

  <rect x="80" y="450" width="1040" height="490" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="128" y="520" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M139 544 l13 15 l27 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="540" font-size="37" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Repeated skill</text>
    <text x="210" y="586" font-size="28" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Show proof near the top.</text>
  </g>

  <line x1="128" y1="642" x2="1072" y2="642" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="128" y="696" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M139 720 l13 15 l27 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="716" font-size="37" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Work output</text>
    <text x="210" y="762" font-size="28" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Name what the intern will produce.</text>
  </g>

  <line x1="128" y1="818" x2="1072" y2="818" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="128" y="872" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M139 896 l13 15 l27 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="892" font-size="37" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Hidden constraint</text>
    <text x="210" y="938" font-size="28" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Check joining date, location, tools, pace.</text>
  </g>

  <rect x="80" y="1002" width="1040" height="74" rx="18" fill="#0b5cff" opacity="0.96"/>
  <text x="600" y="1049" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">Make your application easier to shortlist.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
