<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday follow-up map</title>
  <desc id="desc">A World of Interns card showing a simple Sunday follow-up map with three boxes for conversations, lessons, and the next nudge before a new internship week.</desc>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <rect x="72" y="72" width="1056" height="1056" rx="58" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>
  <circle cx="1008" cy="188" r="78" fill="#ecfeff"/>
  <path d="M964 188h88" stroke="#0891b2" stroke-width="12" stroke-linecap="round"/>
  <path d="M1008 144v88" stroke="#0891b2" stroke-width="12" stroke-linecap="round"/>
  <path d="M958 262c34 30 66 45 106 48" fill="none" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>

  <text x="136" y="170" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">WORLD OF INTERNS</text>
  <text x="136" y="276" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">Sunday follow-up</text>
  <text x="136" y="358" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">map</text>
  <text x="136" y="426" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Turn this week's interactions into next actions.</text>

  <rect x="136" y="514" width="288" height="300" rx="34" fill="#eff6ff" stroke="#bfdbfe" stroke-width="4"/>
  <circle cx="184" cy="574" r="30" fill="#2563eb"/>
  <text x="173" y="586" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">1</text>
  <text x="176" y="656" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">Conversations</text>
  <text x="176" y="716" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">Who replied, advised,</text>
  <text x="176" y="754" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">interviewed, or helped?</text>

  <rect x="456" y="514" width="288" height="300" rx="34" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="4"/>
  <circle cx="504" cy="574" r="30" fill="#16a34a"/>
  <text x="493" y="586" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">2</text>
  <text x="496" y="656" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">Lessons</text>
  <text x="496" y="716" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">What did it reveal</text>
  <text x="496" y="754" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">about skills or fit?</text>

  <rect x="776" y="514" width="288" height="300" rx="34" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/>
  <circle cx="824" cy="574" r="30" fill="#ea580c"/>
  <text x="813" y="586" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">3</text>
  <text x="816" y="656" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">Next nudge</text>
  <text x="816" y="716" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">What small follow-up</text>
  <text x="816" y="754" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">keeps momentum?</text>

  <path d="M424 664h32" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <path d="M744 664h32" stroke="#86efac" stroke-width="10" stroke-linecap="round"/>

  <rect x="136" y="878" width="928" height="96" rx="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
  <text x="176" y="937" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Small follow-ups compound faster than forgotten conversations.</text>

  <text x="136" y="1058" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="27">Sunday reset: choose one conversation, write the lesson, send the next useful nudge.</text>
  <text x="136" y="1116" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="26">worldofinterns.com</text>
</svg>
