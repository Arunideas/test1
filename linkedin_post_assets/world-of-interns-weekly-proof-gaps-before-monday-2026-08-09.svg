<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Close one proof gap before Monday</title>
  <desc id="desc">A World of Interns Sunday weekly report card with three checklist items: outcome-linked bullet, explainer project link, and practice-backed example.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5efe5"/>
      <stop offset="0.55" stop-color="#ece5d8"/>
      <stop offset="1" stop-color="#dde8f7"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="78" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="111" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="111" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="220" font-size="28" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">SUNDAY WEEKLY REPORT</text>
  <text x="80" y="298" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Close one proof gap</text>
  <text x="80" y="370" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">before Monday</text>

  <rect x="80" y="438" width="1040" height="492" rx="30" fill="#fbf9f4" stroke="#d8cebd" stroke-width="3" filter="url(#shadow)"/>

  <g>
    <circle cx="151" cy="523" r="32" fill="#e7f0ff" stroke="#0b5cff" stroke-width="4"/>
    <path d="M135 523 l13 14 l30 -34" fill="none" stroke="#0b5cff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="516" font-size="36" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Outcome-linked bullet</text>
    <text x="215" y="565" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Show what changed after the work.</text>
  </g>

  <line x1="130" y1="630" x2="1070" y2="630" stroke="#d8cebd" stroke-width="3"/>

  <g>
    <circle cx="151" cy="708" r="32" fill="#eef8f1" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M135 708 l13 14 l30 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="701" font-size="36" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Explainer project link</text>
    <text x="215" y="750" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Make the repo or portfolio easy to read.</text>
  </g>

  <line x1="130" y1="815" x2="1070" y2="815" stroke="#d8cebd" stroke-width="3"/>

  <g>
    <circle cx="151" cy="893" r="32" fill="#fff4df" stroke="#d7902f" stroke-width="4"/>
    <path d="M135 893 l13 14 l30 -34" fill="none" stroke="#d7902f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="886" font-size="36" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Practice-backed example</text>
    <text x="215" y="935" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Use one real example in interview prep.</text>
  </g>

  <rect x="120" y="990" width="960" height="78" rx="20" fill="#23303a"/>
  <text x="600" y="1040" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Make proof easy to verify.</text>

  <text x="600" y="1132" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
