<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Read the stipend line before you apply</title>
  <desc id="desc">World of Interns checklist card with three stipend checks for internship listings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="78" y="78" width="48" height="48" rx="10" fill="#0b5cff"/>
  <text x="102" y="111" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="142" y="111" font-size="27" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="225" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">INTERNSHIP LISTING CHECK</text>
  <text x="80" y="310" font-size="76" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Read the</text>
  <text x="80" y="392" font-size="76" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">stipend line</text>

  <rect x="80" y="470" width="1040" height="455" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="135" y="542" width="52" height="52" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M147 566 l14 16 l28 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="560" font-size="42" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Fixed or "up to"?</text>
    <text x="220" y="612" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Ask what decides the final amount.</text>
  </g>

  <g>
    <rect x="135" y="668" width="52" height="52" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M147 692 l14 16 l28 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="686" font-size="42" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Expenses separate?</text>
    <text x="220" y="738" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Travel and internet can change the real value.</text>
  </g>

  <g>
    <rect x="135" y="794" width="52" height="52" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M147 818 l14 16 l28 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="812" font-size="42" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">When is it paid?</text>
    <text x="220" y="864" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Monthly, after completion, or after targets?</text>
  </g>

  <rect x="80" y="970" width="1040" height="78" rx="18" fill="#0b5cff" opacity="0.94"/>
  <text x="600" y="1021" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">A good listing does not make students guess.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
