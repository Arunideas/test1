<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday evidence audit</title>
  <desc id="desc">A World of Interns Sunday weekly report card with checklist rows for role fit, resume proof, and next edit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e8e1d3"/>
    </linearGradient>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#203040" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paper)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="220" font-size="28" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif" letter-spacing="3">SUNDAY WEEKLY REPORT</text>
  <text x="80" y="310" font-size="74" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Sunday</text>
  <text x="80" y="390" font-size="74" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">evidence audit</text>

  <g filter="url(#shadow)">
    <rect x="80" y="455" width="1040" height="510" rx="30" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  </g>

  <g font-family="Arial, sans-serif">
    <line x1="150" y1="600" x2="1050" y2="600" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="150" y1="735" x2="1050" y2="735" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="150" y1="870" x2="1050" y2="870" stroke="#d7cfbf" stroke-width="3"/>

    <g>
      <rect x="145" y="505" width="54" height="54" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M157 532 l14 16 l31 -37" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="230" y="532" font-size="34" fill="#5c6773" font-weight="700">1. Role fit</text>
      <text x="230" y="573" font-size="37" fill="#23303a" font-weight="700">What skill is this role asking for?</text>
    </g>

    <g>
      <rect x="145" y="640" width="54" height="54" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M157 667 l14 16 l31 -37" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="230" y="667" font-size="34" fill="#5c6773" font-weight="700">2. Resume proof</text>
      <text x="230" y="708" font-size="37" fill="#23303a" font-weight="700">Where have you shown it already?</text>
    </g>

    <g>
      <rect x="145" y="775" width="54" height="54" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M157 802 l14 16 l31 -37" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="230" y="802" font-size="34" fill="#5c6773" font-weight="700">3. Next edit</text>
      <text x="230" y="843" font-size="37" fill="#23303a" font-weight="700">Which bullet needs cleanup before Monday?</text>
    </g>
  </g>

  <rect x="135" y="1005" width="930" height="66" rx="33" fill="#23303a"/>
  <text x="600" y="1048" font-size="29" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Apply with proof, not just speed.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
