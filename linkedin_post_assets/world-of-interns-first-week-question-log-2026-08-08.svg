<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">First-week question log</title>
  <desc id="desc">A World of Interns checklist card with four prompts for students to record useful questions during their first week of work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="255" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">First-week</text>
  <text x="80" y="330" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">question log</text>
  <text x="82" y="390" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">A small habit for learning faster at work.</text>

  <g>
    <rect x="80" y="470" width="1040" height="92" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="132" cy="516" r="23" fill="#0b5cff"/>
    <text x="132" y="525" font-size="28" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="180" y="526" font-size="34" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">What was unclear at first?</text>
  </g>

  <g>
    <rect x="80" y="595" width="1040" height="92" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="132" cy="641" r="23" fill="#0b5cff"/>
    <text x="132" y="650" font-size="28" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="180" y="651" font-size="34" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Who or what clarified it?</text>
  </g>

  <g>
    <rect x="80" y="720" width="1040" height="92" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="132" cy="766" r="23" fill="#0b5cff"/>
    <text x="132" y="775" font-size="28" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="180" y="776" font-size="34" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">What changed in my work?</text>
  </g>

  <g>
    <rect x="80" y="845" width="1040" height="92" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="132" cy="891" r="23" fill="#0b5cff"/>
    <text x="132" y="900" font-size="28" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">4</text>
    <text x="180" y="901" font-size="34" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">What will I ask earlier next time?</text>
  </g>

  <line x1="80" y1="1018" x2="1120" y2="1018" stroke="#d7cfbf" stroke-width="3"/>
  <text x="600" y="1082" font-size="25" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
