<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday score map</title>
  <desc id="desc">A World of Interns square card showing three assessment review buckets: strong signal, weak signal, and next practice before Monday applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#18324d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1015" cy="170" r="175" fill="#dceeff"/>
  <circle cx="150" cy="1030" r="235" fill="#dff4e8"/>
  <circle cx="1010" cy="980" r="120" fill="#fff1d8"/>

  <rect x="105" y="105" width="990" height="990" rx="54" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="105" y="105" width="990" height="990" rx="54" fill="none" stroke="#d9e8f4" stroke-width="3"/>

  <text x="165" y="205" fill="#12385d" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3">WORLD OF INTERNS</text>
  <rect x="165" y="246" width="870" height="3" fill="#dce9f4"/>

  <text x="165" y="345" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">Sunday score</text>
  <text x="165" y="427" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">map</text>

  <text x="165" y="505" fill="#4f647d" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Use assessment results to choose one next action.</text>

  <g transform="translate(165 590)">
    <rect x="0" y="0" width="870" height="126" rx="30" fill="#f3faf6" stroke="#cfe8dc" stroke-width="2"/>
    <circle cx="60" cy="63" r="29" fill="#21805c"/>
    <text x="60" y="74" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle">1</text>
    <text x="118" y="54" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">Strong signal</text>
    <text x="118" y="94" fill="#506780" font-family="Inter, Arial, sans-serif" font-size="27">What proof can a recruiter already see?</text>
  </g>

  <g transform="translate(165 750)">
    <rect x="0" y="0" width="870" height="126" rx="30" fill="#fff8ef" stroke="#f0dec5" stroke-width="2"/>
    <circle cx="60" cy="63" r="29" fill="#d97706"/>
    <text x="60" y="74" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle">2</text>
    <text x="118" y="54" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">Weak signal</text>
    <text x="118" y="94" fill="#506780" font-family="Inter, Arial, sans-serif" font-size="27">Where do you only have a claim?</text>
  </g>

  <g transform="translate(165 910)">
    <rect x="0" y="0" width="870" height="126" rx="30" fill="#f4f8ff" stroke="#d6e5fa" stroke-width="2"/>
    <circle cx="60" cy="63" r="29" fill="#1f64d8"/>
    <text x="60" y="74" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle">3</text>
    <text x="118" y="54" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">Next practice</text>
    <text x="118" y="94" fill="#506780" font-family="Inter, Arial, sans-serif" font-size="27">Choose one small fix before Monday.</text>
  </g>

  <text x="165" y="1065" fill="#6a7f98" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600">A score is not a label. It is a map.</text>
</svg>
