<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI mock interview loop checklist</title>
  <desc id="desc">Checklist-style World of Interns visual showing a four-step AI mock interview loop: paste the role, answer out loud, find missing proof, and rewrite one answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="245" font-size="44" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Monday AI Tool</text>
  <text x="80" y="330" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">AI mock</text>
  <text x="80" y="410" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">interview loop</text>

  <rect x="80" y="485" width="1040" height="430" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <circle cx="150" cy="570" r="36" fill="#0b5cff"/>
    <text x="150" y="584" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle">1</text>
    <text x="220" y="584" font-size="40" fill="#23303a" font-weight="700">Paste the role</text>
    <text x="220" y="626" font-size="26" fill="#5c6773">Use the internship description, not a generic prompt.</text>

    <circle cx="150" cy="675" r="36" fill="#0b5cff"/>
    <text x="150" y="689" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle">2</text>
    <text x="220" y="689" font-size="40" fill="#23303a" font-weight="700">Answer out loud</text>
    <text x="220" y="731" font-size="26" fill="#5c6773">No notes. Record where your examples become vague.</text>

    <circle cx="150" cy="780" r="36" fill="#0b5cff"/>
    <text x="150" y="794" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle">3</text>
    <text x="220" y="794" font-size="40" fill="#23303a" font-weight="700">Find missing proof</text>
    <text x="220" y="836" font-size="26" fill="#5c6773">Ask AI to flag claims you cannot defend.</text>

    <circle cx="150" cy="885" r="36" fill="#0b5cff"/>
    <text x="150" y="899" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle">4</text>
    <text x="220" y="899" font-size="40" fill="#23303a" font-weight="700">Rewrite one answer</text>
    <text x="220" y="941" font-size="26" fill="#5c6773">Sharper examples beat borrowed confidence.</text>
  </g>

  <line x1="150" y1="606" x2="150" y2="639" stroke="#d7cfbf" stroke-width="5"/>
  <line x1="150" y1="711" x2="150" y2="744" stroke="#d7cfbf" stroke-width="5"/>
  <line x1="150" y1="816" x2="150" y2="849" stroke="#d7cfbf" stroke-width="5"/>

  <text x="600" y="1085" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
