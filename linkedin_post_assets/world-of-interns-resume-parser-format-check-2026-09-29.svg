<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Resume parser format check</title>
  <desc id="desc">A World of Interns checklist card explaining resume formatting rules that help applicant tracking systems read fresher resumes.</desc>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <circle cx="1040" cy="140" r="180" fill="#dbeafe"/>
  <circle cx="150" cy="1030" r="210" fill="#dcfce7"/>
  <rect x="90" y="88" width="1020" height="1024" rx="52" fill="#ffffff" stroke="#dbe4ef" stroke-width="4"/>
  <rect x="132" y="130" width="936" height="120" rx="30" fill="#0f172a"/>
  <text x="174" y="188" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="2">WORLD OF INTERNS</text>
  <text x="174" y="226" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="24">Tuesday Resume Review</text>

  <text x="132" y="342" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800">Before you send</text>
  <text x="132" y="416" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800">your resume...</text>
  <rect x="132" y="456" width="500" height="12" rx="6" fill="#2563eb"/>

  <rect x="700" y="318" width="280" height="350" rx="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="730" y="352" width="220" height="18" rx="9" fill="#94a3b8"/>
  <rect x="730" y="394" width="170" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="730" y="438" width="210" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="730" y="482" width="190" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="730" y="526" width="215" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="730" y="570" width="155" height="14" rx="7" fill="#cbd5e1"/>
  <path d="M970 592 L1030 652 L1130 520" fill="none" stroke="#16a34a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="132" y="545" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">Do the 2-minute plain text test:</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#1e293b">
    <rect x="132" y="600" width="936" height="78" rx="20" fill="#eff6ff"/>
    <circle cx="178" cy="639" r="18" fill="#2563eb"/>
    <text x="171" y="650" fill="#ffffff" font-size="28" font-weight="700">1</text>
    <text x="220" y="650">Copy your full resume.</text>

    <rect x="132" y="700" width="936" height="78" rx="20" fill="#f8fafc"/>
    <circle cx="178" cy="739" r="18" fill="#2563eb"/>
    <text x="171" y="750" fill="#ffffff" font-size="28" font-weight="700">2</text>
    <text x="220" y="750">Paste it into a plain notes file.</text>

    <rect x="132" y="800" width="936" height="78" rx="20" fill="#eff6ff"/>
    <circle cx="178" cy="839" r="18" fill="#2563eb"/>
    <text x="171" y="850" fill="#ffffff" font-size="28" font-weight="700">3</text>
    <text x="220" y="850">Check if headings, dates and bullets stay in order.</text>
  </g>

  <rect x="132" y="930" width="936" height="98" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <text x="172" y="972" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">If the text looks scrambled, simplify the layout.</text>
  <text x="172" y="1014" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="26">Avoid heavy tables, icons, text boxes, and hidden headers.</text>

  <text x="132" y="1080" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="25">Make the PDF easy for recruiters and the text layer easy for ATS.</text>
</svg>
