<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">JD to resume proof check</title>
  <desc id="desc">A World of Interns checklist card with four practical steps for using AI before applying to an internship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>
  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>
  <text x="80" y="220" font-size="32" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">MONDAY AI TOOL</text>
  <text x="80" y="305" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">JD to resume</text>
  <text x="80" y="382" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">proof check</text>
  <rect x="80" y="450" width="1040" height="540" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <rect x="130" y="520" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M141 545 l13 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="553" font-size="38" fill="#23303a" font-weight="700">Match 5 JD keywords to proof</text>
    <text x="205" y="596" font-size="24" fill="#5c6773">Do not stop at words. Find projects, tools, and results.</text>
    <rect x="130" y="650" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M141 675 l13 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="683" font-size="38" fill="#23303a" font-weight="700">Turn tasks into evidence</text>
    <text x="205" y="726" font-size="24" fill="#5c6773">Replace broad claims with one clear action and outcome.</text>
    <rect x="130" y="780" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M141 805 l13 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="813" font-size="38" fill="#23303a" font-weight="700">Find missing skill gaps</text>
    <text x="205" y="856" font-size="24" fill="#5c6773">Use gaps for prep, not for inventing experience.</text>
    <rect x="130" y="910" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M141 935 l13 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="943" font-size="38" fill="#23303a" font-weight="700">Rewrite one tailored line</text>
  </g>
  <text x="600" y="1090" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
