<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The 5-line handover note</title>
  <desc id="desc">A World of Interns checklist card with five prompts students can save after finishing work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#7a6f5d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <g filter="url(#paperShadow)">
    <rect x="90" y="190" width="1020" height="845" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="155" y1="190" x2="155" y2="1035" stroke="#e7d6c4" stroke-width="3"/>
    <g stroke="#eee7dc" stroke-width="2">
      <line x1="130" y1="380" x2="1060" y2="380"/>
      <line x1="130" y1="510" x2="1060" y2="510"/>
      <line x1="130" y1="640" x2="1060" y2="640"/>
      <line x1="130" y1="770" x2="1060" y2="770"/>
      <line x1="130" y1="900" x2="1060" y2="900"/>
    </g>
  </g>

  <text x="160" y="286" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">STUDENT STORY</text>
  <text x="160" y="350" font-size="62" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">The 5-line</text>
  <text x="160" y="420" font-size="62" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">handover note</text>

  <g font-family="Arial, sans-serif" fill="#23303a">
    <g transform="translate(170 515)">
      <rect x="0" y="-38" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -17 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="76" y="-5" font-size="40" font-weight="700">1. Task touched</text>
      <text x="76" y="42" font-size="26" fill="#5c6773">What work did you actually handle?</text>
    </g>

    <g transform="translate(170 645)">
      <rect x="0" y="-38" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -17 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="76" y="-5" font-size="40" font-weight="700">2. Unclear point</text>
      <text x="76" y="42" font-size="26" fill="#5c6773">What was confusing at the start?</text>
    </g>

    <g transform="translate(170 775)">
      <rect x="0" y="-38" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -17 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="76" y="-5" font-size="40" font-weight="700">3. Decision made</text>
      <text x="76" y="42" font-size="26" fill="#5c6773">Which choice moved the task forward?</text>
    </g>

    <g transform="translate(170 905)">
      <rect x="0" y="-38" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -17 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="76" y="-5" font-size="40" font-weight="700">4. Proof saved</text>
      <text x="76" y="42" font-size="26" fill="#5c6773">Where can someone verify the work?</text>
    </g>

    <g transform="translate(170 1035)">
      <rect x="0" y="-38" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -17 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="76" y="-5" font-size="40" font-weight="700">5. Next check</text>
      <text x="76" y="42" font-size="26" fill="#5c6773">What should the next person inspect first?</text>
    </g>
  </g>

  <text x="600" y="1140" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
