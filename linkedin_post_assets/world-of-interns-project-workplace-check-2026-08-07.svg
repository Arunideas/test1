<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Project workplace check</title>
  <desc id="desc">A World of Interns checklist card for making a college project workplace-ready.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#23303a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <rect x="78" y="184" width="1044" height="804" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>
  <text x="120" y="282" font-size="74" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Project</text>
  <text x="120" y="360" font-size="74" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">workplace check</text>
  <text x="124" y="418" font-size="30" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">A project that runs is a start. Reliability is the next layer.</text>

  <g transform="translate(120 505)">
    <rect x="0" y="-40" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M13 -12 l13 15 l27 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Setup is clear</text>
    <text x="82" y="42" font-size="25" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">A stranger can run it without a call.</text>
  </g>

  <g transform="translate(120 660)">
    <rect x="0" y="-40" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M13 -12 l13 15 l27 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Edge cases handled</text>
    <text x="82" y="42" font-size="25" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">It does not break on the second input.</text>
  </g>

  <g transform="translate(120 815)">
    <rect x="0" y="-40" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M13 -12 l13 15 l27 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Demo works twice</text>
    <text x="82" y="42" font-size="25" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">The proof survives a repeat attempt.</text>
  </g>

  <g transform="translate(120 970)">
    <rect x="0" y="-40" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M13 -12 l13 15 l27 -35" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="0" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Trade-offs explained</text>
    <text x="82" y="42" font-size="25" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">You can say why you chose one path.</text>
  </g>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
