<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday skill-gap reset</title>
  <desc id="desc">World of Interns checklist card with three steps: Role fit, Proof depth, and Next edit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="245" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">SUNDAY WEEKLY REPORT</text>
  <text x="80" y="325" font-size="68" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Sunday skill-gap</text>
  <text x="80" y="402" font-size="68" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">reset</text>
  <text x="80" y="470" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">Before Monday applications, check the proof behind each role.</text>

  <rect x="80" y="555" width="1040" height="118" rx="20" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="110" y="585" width="58" height="58" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M122 614 l15 17 l30 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="610" font-size="34" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">1. Role fit</text>
  <text x="200" y="650" font-size="28" fill="#23303a" font-family="Arial, sans-serif">Can you prove the skills this role asks for?</text>

  <rect x="80" y="705" width="1040" height="118" rx="20" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="110" y="735" width="58" height="58" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M122 764 l15 17 l30 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="760" font-size="34" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">2. Proof depth</text>
  <text x="200" y="800" font-size="28" fill="#23303a" font-family="Arial, sans-serif">Show what you built, changed, or improved.</text>

  <rect x="80" y="855" width="1040" height="118" rx="20" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="110" y="885" width="58" height="58" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M122 914 l15 17 l30 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="910" font-size="34" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">3. Next edit</text>
  <text x="200" y="950" font-size="28" fill="#23303a" font-family="Arial, sans-serif">Fix one vague resume line before applying.</text>

  <line x1="80" y1="1045" x2="1120" y2="1045" stroke="#d7cfbf" stroke-width="3"/>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
