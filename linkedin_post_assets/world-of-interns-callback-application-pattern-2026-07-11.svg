<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Callback applications are easier to read</title>
  <desc id="desc">A World of Interns checklist card with four checks: role asks, proof moves up, fit line is specific, fewer better applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="84" y="205" width="1032" height="810" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <rect x="84" y="205" width="1032" height="118" rx="28" fill="#23303a"/>
    <path d="M84 292 h1032 v31 h-1032z" fill="#23303a"/>
  </g>

  <text x="130" y="283" font-size="34" fill="#ffffff" font-weight="700" font-family="Arial, sans-serif">Student callback pattern</text>

  <text x="130" y="405" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Callback applications</text>
  <text x="130" y="474" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">are easier to read.</text>

  <text x="132" y="542" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Not louder. Not longer. Just clearer.</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(130 625)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="0" font-size="38" fill="#23303a" font-weight="700">Role asks</text>
      <text x="72" y="40" font-size="25" fill="#5c6773">What does this opening repeat?</text>
    </g>

    <g transform="translate(130 735)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="0" font-size="38" fill="#23303a" font-weight="700">Proof moves up</text>
      <text x="72" y="40" font-size="25" fill="#5c6773">Put the closest project near the top.</text>
    </g>

    <g transform="translate(130 845)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="0" font-size="38" fill="#23303a" font-weight="700">Fit line is specific</text>
      <text x="72" y="40" font-size="25" fill="#5c6773">One sentence explains why this role.</text>
    </g>

    <g transform="translate(130 955)">
      <rect x="0" y="-34" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -11 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="0" font-size="38" fill="#23303a" font-weight="700">Fewer, better applications</text>
      <text x="72" y="40" font-size="25" fill="#5c6773">A smaller list can show stronger match.</text>
    </g>
  </g>

  <line x1="816" y1="585" x2="816" y2="962" stroke="#d7cfbf" stroke-width="3"/>
  <text x="858" y="666" font-size="88" fill="#0b5cff" font-weight="800" font-family="Georgia, 'Times New Roman', serif">10</text>
  <text x="858" y="716" font-size="31" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">minutes before</text>
  <text x="858" y="756" font-size="31" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">you apply</text>
  <text x="858" y="830" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Check the role.</text>
  <text x="858" y="868" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Move the proof.</text>
  <text x="858" y="906" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Then send.</text>

  <text x="600" y="1132" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
