<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="A World of Interns checklist card titled Before you apply with four steps: paste role, paste proof, match evidence, and delete weak claims.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe7"/>
      <stop offset="1" stop-color="#e7dfd2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#23303a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1040" cy="130" r="210" fill="#0b5cff" opacity="0.08"/>
  <circle cx="110" cy="1040" r="250" fill="#2f7d4f" opacity="0.09"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <rect x="80" y="190" width="1040" height="830" rx="34" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#shadow)"/>
  <text x="120" y="300" font-size="28" font-weight="800" fill="#0b5cff" font-family="Arial, sans-serif">MONDAY AI TOOL</text>
  <text x="120" y="382" font-size="72" font-weight="900" fill="#23303a" font-family="Arial, sans-serif">Before you apply</text>
  <text x="120" y="428" font-size="31" fill="#5c6773" font-family="Arial, sans-serif">Use AI to check relevance, not invent experience.</text>
  
    <g>
      <circle cx="143" cy="428" r="36" fill="#0b5cff"/>
      <text x="143" y="443" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" font-family="Arial, sans-serif">1</text>
      <text x="206" y="418" font-size="38" font-weight="800" fill="#23303a" font-family="Arial, sans-serif">Paste role</text>
      <text x="206" y="462" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Copy the internship description first.</text>
    </g>

    <g>
      <circle cx="143" cy="570" r="36" fill="#0b5cff"/>
      <text x="143" y="585" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" font-family="Arial, sans-serif">2</text>
      <text x="206" y="560" font-size="38" font-weight="800" fill="#23303a" font-family="Arial, sans-serif">Paste proof</text>
      <text x="206" y="604" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Add real projects, results, and course work.</text>
    </g>

    <g>
      <circle cx="143" cy="712" r="36" fill="#0b5cff"/>
      <text x="143" y="727" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" font-family="Arial, sans-serif">3</text>
      <text x="206" y="702" font-size="38" font-weight="800" fill="#23303a" font-family="Arial, sans-serif">Match evidence</text>
      <text x="206" y="746" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Ask AI to quote only supported fit.</text>
    </g>

    <g>
      <circle cx="143" cy="854" r="36" fill="#0b5cff"/>
      <text x="143" y="869" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" font-family="Arial, sans-serif">4</text>
      <text x="206" y="844" font-size="38" font-weight="800" fill="#23303a" font-family="Arial, sans-serif">Delete weak claims</text>
      <text x="206" y="888" font-size="27" fill="#5c6773" font-family="Arial, sans-serif">Keep what you can defend live.</text>
    </g>
  <line x1="120" y1="960" x2="1080" y2="960" stroke="#d7cfbf" stroke-width="3"/>
  <text x="120" y="1010" font-size="30" font-weight="800" fill="#23303a" font-family="Arial, sans-serif">Rule:</text>
  <text x="205" y="1010" font-size="30" fill="#23303a" font-family="Arial, sans-serif">If you cannot defend it in an interview, remove it.</text>
  <text x="600" y="1128" font-size="24" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
