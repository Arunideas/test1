<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>
  <rect x="74" y="74" width="1052" height="1052" rx="34" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <g>
    <rect x="100" y="104" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="123" y="136" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="160" y="136" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>
  <text x="100" y="246" font-size="34" fill="#0b5cff" font-weight="800" font-family="Arial, sans-serif">RECRUITER INSIGHT</text>
  <text x="100" y="330" font-size="72" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">A follow-up</text>
<text x="100" y="412" font-size="72" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">recruiters can</text>
<text x="100" y="494" font-size="72" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">answer</text>
  <line x1="100" y1="385" x2="530" y2="385" stroke="#0b5cff" stroke-width="8" stroke-linecap="round"/>
  <g>
    <circle cx="128" cy="428" r="34" fill="#0b5cff"/>
    <text x="128" y="440" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="190" y="424" font-size="38" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Role + date</text>
    <text x="190" y="468" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Make the application easy to place.</text>
  </g>
<g>
    <circle cx="128" cy="563" r="34" fill="#0b5cff"/>
    <text x="128" y="575" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="190" y="559" font-size="38" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Relevant proof</text>
    <text x="190" y="603" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">One line that matches the role.</text>
  </g>
<g>
    <circle cx="128" cy="698" r="34" fill="#0b5cff"/>
    <text x="128" y="710" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="190" y="694" font-size="38" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">One clear ask</text>
    <text x="190" y="738" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Ask what to send or expect next.</text>
  </g>
<g>
    <circle cx="128" cy="833" r="34" fill="#0b5cff"/>
    <text x="128" y="845" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">4</text>
    <text x="190" y="829" font-size="38" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">No daily nudges</text>
    <text x="190" y="873" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Give the process room.</text>
  </g>
  <rect x="100" y="985" width="1000" height="74" rx="18" fill="#f3efe7" stroke="#d7cfbf" stroke-width="2"/>
  <text x="600" y="1032" font-size="27" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">Keep it specific. Keep it easy to reply to.</text>
  <text x="600" y="1105" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  |  practical, not promotional</text>
</svg>