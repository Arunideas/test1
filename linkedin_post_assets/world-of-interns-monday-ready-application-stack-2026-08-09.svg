<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday reset for Monday applications</title>
  <desc id="desc">World of Interns checklist card with four checks: role fit, first-screen proof, project outcome, and two-line note.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e8dfcf"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.10"/>

  <g transform="translate(80 78)">
    <rect width="48" height="48" rx="11" fill="#0b5cff"/>
    <text x="24" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">W</text>
    <text x="64" y="32" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#23303a">World of Interns</text>
  </g>

  <text x="80" y="214" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0b5cff">SUNDAY WEEKLY REPORT</text>
  <text x="80" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#23303a">Sunday reset for</text>
  <text x="80" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#23303a">Monday applications</text>

  <g filter="url(#shadow)">
    <rect x="80" y="445" width="1040" height="500" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(130 535)">
      <rect x="0" y="-35" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -12 l12 13 l24 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="0" font-size="40" font-weight="700" fill="#23303a">Role fit</text>
      <text x="78" y="42" font-size="25" fill="#5c6773">Can you explain why this role matches you?</text>
    </g>

    <g transform="translate(130 650)">
      <rect x="0" y="-35" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -12 l12 13 l24 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="0" font-size="40" font-weight="700" fill="#23303a">First-screen proof</text>
      <text x="78" y="42" font-size="25" fill="#5c6773">Move matching evidence into the top half.</text>
    </g>

    <g transform="translate(130 765)">
      <rect x="0" y="-35" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -12 l12 13 l24 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="0" font-size="40" font-weight="700" fill="#23303a">Project outcome</text>
      <text x="78" y="42" font-size="25" fill="#5c6773">Rename one bullet so the result is visible.</text>
    </g>

    <g transform="translate(130 880)">
      <rect x="0" y="-35" width="48" height="48" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -12 l12 13 l24 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="0" font-size="40" font-weight="700" fill="#23303a">Two-line note</text>
      <text x="78" y="42" font-size="25" fill="#5c6773">Write why this application fits before applying.</text>
    </g>
  </g>

  <line x1="80" y1="1012" x2="1120" y2="1012" stroke="#d7cfbf" stroke-width="3"/>
  <text x="80" y="1074" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#23303a">Remove friction before the week starts.</text>
  <text x="600" y="1132" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#5c6773">worldofinterns.in - practical, not promotional</text>
</svg>
