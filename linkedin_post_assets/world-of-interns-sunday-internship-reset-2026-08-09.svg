<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday internship reset</title>
  <desc id="desc">A World of Interns weekly report card with four rows: saved roles, strongest match, skill gap, and Monday first step.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="245" font-size="38" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Weekly report</text>
  <text x="80" y="320" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Sunday internship</text>
  <text x="80" y="392" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">reset</text>

  <rect x="80" y="470" width="1040" height="480" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <line x1="150" y1="570" x2="1050" y2="570" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="150" y1="680" x2="1050" y2="680" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="150" y1="790" x2="1050" y2="790" stroke="#d7cfbf" stroke-width="3"/>

    <circle cx="150" cy="520" r="18" fill="#0b5cff"/>
    <text x="190" y="532" font-size="38" fill="#23303a" font-weight="700">Saved roles</text>
    <text x="800" y="532" font-size="30" fill="#5c6773" text-anchor="end">Review</text>

    <circle cx="150" cy="630" r="18" fill="#2f7d4f"/>
    <text x="190" y="642" font-size="38" fill="#23303a" font-weight="700">Strongest match</text>
    <text x="800" y="642" font-size="30" fill="#5c6773" text-anchor="end">Choose</text>

    <circle cx="150" cy="740" r="18" fill="#c0492f"/>
    <text x="190" y="752" font-size="38" fill="#23303a" font-weight="700">Skill gap</text>
    <text x="800" y="752" font-size="30" fill="#5c6773" text-anchor="end">Name it</text>

    <circle cx="150" cy="850" r="18" fill="#0b5cff"/>
    <text x="190" y="862" font-size="38" fill="#23303a" font-weight="700">Monday first step</text>
    <text x="800" y="862" font-size="30" fill="#5c6773" text-anchor="end">Act</text>
  </g>

  <rect x="830" y="210" width="230" height="170" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <text x="945" y="275" font-size="26" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">10 minute</text>
  <text x="945" y="332" font-size="58" fill="#0b5cff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">RESET</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in | practical, not promotional</text>
</svg>
