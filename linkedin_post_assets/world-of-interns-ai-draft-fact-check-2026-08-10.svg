<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
  <title>AI draft fact-check</title>
  <desc>A World of Interns checklist card with four checks: evidence, source, specificity, and ownership.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="250" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">AI draft</text>
  <text x="80" y="325" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">fact-check</text>
  <text x="80" y="385" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Before you paste it into an application.</text>

  <rect x="80" y="470" width="1040" height="430" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <rect x="135" y="535" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M145 558 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="210" y="570" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Is there real evidence?</text>

  <rect x="135" y="635" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M145 658 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="210" y="670" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Can you name the source?</text>

  <rect x="135" y="735" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M145 758 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="210" y="770" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Is the claim specific?</text>

  <rect x="135" y="835" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M145 858 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="210" y="870" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Would you defend it?</text>

  <line x1="80" y1="970" x2="1120" y2="970" stroke="#d7cfbf" stroke-width="3"/>
  <text x="80" y="1035" font-size="34" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Keep clarity. Remove invention.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
