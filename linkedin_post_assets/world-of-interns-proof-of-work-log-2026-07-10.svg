<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Keep a proof-of-work log</title>
  <desc id="desc">A World of Interns card with three proof-log rows: task, decision, evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="250" font-size="34" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">FRIDAY FUTURE SKILL</text>
  <text x="80" y="355" font-size="74" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Keep a</text>
  <text x="80" y="445" font-size="74" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">proof-of-work</text>
  <text x="80" y="535" font-size="74" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">log.</text>

  <rect x="80" y="615" width="1040" height="350" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <rect x="130" y="675" width="940" height="72" rx="18" fill="#ffffff" stroke="#d7cfbf" stroke-width="2"/>
    <text x="170" y="722" font-size="30" fill="#0b5cff" font-weight="800">TASK</text>
    <text x="345" y="722" font-size="32" fill="#23303a" font-weight="700">What did I try?</text>

    <rect x="130" y="775" width="940" height="72" rx="18" fill="#ffffff" stroke="#d7cfbf" stroke-width="2"/>
    <text x="170" y="822" font-size="30" fill="#0b5cff" font-weight="800">DECISION</text>
    <text x="345" y="822" font-size="32" fill="#23303a" font-weight="700">Why did I choose this?</text>

    <rect x="130" y="875" width="940" height="72" rx="18" fill="#ffffff" stroke="#d7cfbf" stroke-width="2"/>
    <text x="170" y="922" font-size="30" fill="#0b5cff" font-weight="800">EVIDENCE</text>
    <text x="345" y="922" font-size="32" fill="#23303a" font-weight="700">What proof did I create?</text>
  </g>

  <text x="600" y="1095" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
