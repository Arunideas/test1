<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Thinking Bug Report</title>
  <desc id="desc">World of Interns card titled Thinking Bug Report with three checklist items: I assumed, I missed, Next time I will check.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="55%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1020" cy="170" r="220" fill="#bfdbfe" opacity="0.38"/>
  <circle cx="120" cy="1040" r="260" fill="#93c5fd" opacity="0.24"/>
  <rect x="92" y="92" width="1016" height="1016" rx="56" fill="#ffffff" opacity="0.82"/>
  <rect x="132" y="132" width="936" height="936" rx="44" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="132" y="132" width="936" height="138" rx="44" fill="#0f4c81"/>
  <rect x="132" y="224" width="936" height="46" fill="#0f4c81"/>
  <text x="180" y="214" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="1.8">WORLD OF INTERNS</text>
  <text x="180" y="366" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="800" fill="#102a43">Thinking Bug Report</text>
  <text x="184" y="430" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="500" fill="#486581">Do this after a wrong answer, bug, or mock test.</text>

  <g transform="translate(180 520)">
    <rect x="0" y="0" width="840" height="112" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="58" cy="56" r="26" fill="#0f4c81"/>
    <path d="M46 56l8 9 18-21" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="67" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="750" fill="#102a43">I assumed...</text>
  </g>
  <g transform="translate(180 662)">
    <rect x="0" y="0" width="840" height="112" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="58" cy="56" r="26" fill="#2563eb"/>
    <path d="M46 56l8 9 18-21" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="67" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="750" fill="#102a43">I missed...</text>
  </g>
  <g transform="translate(180 804)">
    <rect x="0" y="0" width="840" height="112" rx="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="58" cy="56" r="26" fill="#0891b2"/>
    <path d="M46 56l8 9 18-21" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="67" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="750" fill="#102a43">Next time I will check...</text>
  </g>

  <line x1="180" y1="980" x2="1020" y2="980" stroke="#d9e2ec" stroke-width="3"/>
  <text x="180" y="1038" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" fill="#0f4c81">Memorising gives speed. Debugging gives range.</text>
</svg>