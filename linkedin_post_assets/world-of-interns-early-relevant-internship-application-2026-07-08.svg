<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="World of Interns card comparing early relevant internship applications with late over-polished applications.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <rect x="78" y="78" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="101" y="111" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="111" font-size="26" fill="#23303a" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="250" font-size="58" fill="#23303a" font-weight="800" text-anchor="start" font-family="Arial, sans-serif">Early plus relevant beats</text>
<text x="80" y="320" font-size="58" fill="#23303a" font-weight="800" text-anchor="start" font-family="Arial, sans-serif">late plus over-polished</text>
  <text x="82" y="390" font-size="31" fill="#5c6773" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">A simple 24-hour rule for internship applications</text>

  <rect x="80" y="485" width="500" height="435" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="620" y="485" width="500" height="435" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <circle cx="128" cy="545" r="27" fill="#2f7d4f"/>
  <text x="128" y="556" font-size="31" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="175" y="555" font-size="35" fill="#2f7d4f" font-weight="800" text-anchor="start" font-family="Arial, sans-serif">Early + relevant</text>
  <text x="115" y="650" font-size="31" fill="#23303a" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Role fit around 70%</text>
  <text x="115" y="720" font-size="31" fill="#23303a" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">One proof-based project</text>
  <text x="115" y="790" font-size="31" fill="#23303a" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Two-line fit note</text>
  <text x="115" y="860" font-size="27" fill="#5c6773" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Sent while the shortlist is</text>
<text x="115" y="895" font-size="27" fill="#5c6773" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">still moving.</text>

  <circle cx="668" cy="545" r="27" fill="#c0492f"/>
  <text x="668" y="556" font-size="31" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="715" y="555" font-size="35" fill="#c0492f" font-weight="800" text-anchor="start" font-family="Arial, sans-serif">Late + perfect</text>
  <text x="655" y="650" font-size="31" fill="#23303a" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Over-edited resume</text>
  <text x="655" y="720" font-size="31" fill="#23303a" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Deadline stress</text>
  <text x="655" y="790" font-size="31" fill="#23303a" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Shortlist already full</text>
  <text x="655" y="860" font-size="27" fill="#5c6773" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Neat application, weaker</text>
<text x="655" y="895" font-size="27" fill="#5c6773" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">timing.</text>

  <rect x="170" y="975" width="860" height="92" rx="46" fill="#0b5cff" opacity="0.95"/>
  <text x="600" y="1034" font-size="33" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">Apply within 24 hours when the role fit is real.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" font-weight="400" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>