<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Skills section proof check</title>
  <desc id="desc">A World of Interns checklist card showing three ways to make resume skills more credible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="240" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Tuesday Resume Review</text>
  <text x="80" y="318" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Skills section</text>
  <text x="80" y="392" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">proof check</text>

  <rect x="80" y="470" width="1040" height="120" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="120" y="508" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M130 530 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="190" y="544" font-size="40" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Group skills by the work they support.</text>

  <rect x="80" y="630" width="1040" height="120" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="120" y="668" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M130 690 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="190" y="704" font-size="40" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Add one proof line under each group.</text>

  <rect x="80" y="790" width="1040" height="120" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="120" y="828" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M130 850 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="190" y="864" font-size="40" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Remove what you cannot explain yet.</text>

  <text x="80" y="1010" font-size="31" fill="#5c6773" font-family="Arial, sans-serif">A skills list is stronger when it shows context, not just keywords.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
