<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Skills need proof</title>
  <desc id="desc">A World of Interns checklist card showing four ways to prove resume skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.07"/>
  <rect x="72" y="72" width="1056" height="1056" rx="36" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <rect x="112" y="112" width="48" height="48" rx="11" fill="#0b5cff"/>
  <text x="136" y="145" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>
  <text x="176" y="145" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#23303a">World of Interns</text>

  <text x="112" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="800" fill="#23303a">Skills need proof</text>
  <text x="112" y="344" font-family="Arial, sans-serif" font-size="31" fill="#5c6773">A resume skill is stronger when it has context.</text>

  <g transform="translate(112 438)">
    <rect x="0" y="0" width="58" height="58" rx="12" fill="none" stroke="#23303a" stroke-width="5"/>
    <path d="M14 29 l15 15 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="41" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#23303a">Name the skill</text>
    <text x="88" y="84" font-family="Arial, sans-serif" font-size="25" fill="#5c6773">Keep the list short and relevant.</text>
  </g>

  <g transform="translate(112 600)">
    <rect x="0" y="0" width="58" height="58" rx="12" fill="none" stroke="#23303a" stroke-width="5"/>
    <path d="M14 29 l15 15 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="41" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#23303a">Show where you used it</text>
    <text x="88" y="84" font-family="Arial, sans-serif" font-size="25" fill="#5c6773">Project, assignment, internship, or club work.</text>
  </g>

  <g transform="translate(112 762)">
    <rect x="0" y="0" width="58" height="58" rx="12" fill="none" stroke="#23303a" stroke-width="5"/>
    <path d="M14 29 l15 15 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="41" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#23303a">Add the output</text>
    <text x="88" y="84" font-family="Arial, sans-serif" font-size="25" fill="#5c6773">What you built, cleaned, compared, or presented.</text>
  </g>

  <g transform="translate(112 924)">
    <rect x="0" y="0" width="58" height="58" rx="12" fill="none" stroke="#23303a" stroke-width="5"/>
    <path d="M14 29 l15 15 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="41" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#23303a">Be ready to explain it</text>
    <text x="88" y="84" font-family="Arial, sans-serif" font-size="25" fill="#5c6773">One proof line beats a wall of keywords.</text>
  </g>

  <text x="600" y="1074" font-family="Arial, sans-serif" font-size="23" fill="#5c6773" text-anchor="middle">worldofinterns.in - practical, not promotional</text>
</svg>
