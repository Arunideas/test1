<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI resume fact-check</title>
  <desc id="desc">World of Interns checklist card with four checks: proof you have, result you can explain, skill you can show, and claim to remove.</desc>
  <rect width="1200" height="1200" fill="#F7F2E8"/>
  <circle cx="1020" cy="156" r="98" fill="#F4C95D" opacity="0.94"/>
  <circle cx="142" cy="1034" r="126" fill="#CFE8D6" opacity="0.82"/>
  <rect x="86" y="84" width="1028" height="1032" rx="52" fill="#FFFFFF" stroke="#17233C" stroke-width="8"/>

  <text x="132" y="164" fill="#17233C" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2">WORLD OF INTERNS</text>
  <rect x="132" y="204" width="236" height="48" rx="24" fill="#F4C95D"/>
  <text x="160" y="237" fill="#17233C" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">MONDAY AI TOOL</text>

  <text x="132" y="350" fill="#17233C" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800">
    <tspan x="132" dy="0">AI resume</tspan>
    <tspan x="132" dy="88">fact-check</tspan>
  </text>
  <text x="132" y="550" fill="#41506B" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">
    <tspan x="132" dy="0">Before a bullet sounds better,</tspan>
    <tspan x="132" dy="48">make sure it stays true.</tspan>
  </text>

  <g transform="translate(792 252)">
    <rect x="0" y="0" width="254" height="330" rx="28" fill="#17233C"/>
    <rect x="30" y="38" width="194" height="252" rx="16" fill="#FFFFFF"/>
    <rect x="62" y="78" width="130" height="16" rx="8" fill="#D9E8FF"/>
    <rect x="62" y="122" width="100" height="14" rx="7" fill="#CAD5E6"/>
    <rect x="62" y="158" width="138" height="14" rx="7" fill="#CAD5E6"/>
    <rect x="62" y="194" width="116" height="14" rx="7" fill="#CAD5E6"/>
    <rect x="62" y="230" width="82" height="14" rx="7" fill="#F4C95D"/>
    <circle cx="190" cy="250" r="48" fill="none" stroke="#1F7A4D" stroke-width="12"/>
    <line x1="224" y1="284" x2="254" y2="314" stroke="#1F7A4D" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g transform="translate(132 690)">
    <rect x="0" y="0" width="936" height="300" rx="32" fill="#F7F9FC" stroke="#CAD5E6" stroke-width="4"/>
    <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#17233C">
      <circle cx="54" cy="62" r="21" fill="#CFE8D6"/>
      <path d="M43 61 l8 9 l18 -22" fill="none" stroke="#1F7A4D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="74">Proof you actually have</text>

      <circle cx="54" cy="132" r="21" fill="#CFE8D6"/>
      <path d="M43 131 l8 9 l18 -22" fill="none" stroke="#1F7A4D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="144">Result you can explain</text>

      <circle cx="54" cy="202" r="21" fill="#CFE8D6"/>
      <path d="M43 201 l8 9 l18 -22" fill="none" stroke="#1F7A4D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="214">Skill you can demonstrate</text>

      <circle cx="54" cy="272" r="21" fill="#FFE8A6"/>
      <path d="M42 272 h26" fill="none" stroke="#B45309" stroke-width="7" stroke-linecap="round"/>
      <text x="96" y="284">Claim you should remove</text>
    </g>
  </g>

  <line x1="132" y1="1040" x2="1068" y2="1040" stroke="#E2E7F0" stroke-width="4"/>
  <text x="132" y="1086" fill="#17233C" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Clear beats inflated.</text>
  <text x="835" y="1086" fill="#41506B" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">worldofinterns.com</text>
</svg>
