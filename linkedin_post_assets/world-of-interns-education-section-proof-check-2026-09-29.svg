<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Education section proof check</title>
  <desc id="desc">Before-and-after resume card showing how to make a fresher education section shorter and more relevant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .ink { fill: #23303a; }
      .sub { fill: #5c6773; }
      .blue { fill: #0b5cff; }
      .red { fill: #c0492f; }
      .green { fill: #2f7d4f; }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" class="sans">W</text>
    <text x="140" y="112" font-size="26" font-weight="700" class="sans ink">World of Interns</text>
  </g>

  <text x="80" y="235" font-size="52" font-weight="800" class="serif ink">Education section:</text>
  <text x="80" y="300" font-size="52" font-weight="800" class="serif ink">basics + proof</text>
  <text x="80" y="350" font-size="27" class="sans sub">A 7-second resume check for freshers</text>

  <rect x="80" y="405" width="500" height="575" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="620" y="405" width="500" height="575" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <text x="330" y="470" font-size="30" font-weight="800" text-anchor="middle" class="sans red">BEFORE</text>
  <text x="870" y="470" font-size="30" font-weight="800" text-anchor="middle" class="sans green">AFTER</text>

  <text x="120" y="535" font-size="30" font-weight="700" class="serif ink">Education</text>
  <text x="120" y="590" font-size="26" class="sans sub">B.Tech Computer Science</text>
  <text x="120" y="635" font-size="26" class="sans sub">ABC College, 2026</text>
  <text x="120" y="680" font-size="26" class="sans sub">10th: 91%, 12th: 88%</text>
  <text x="120" y="725" font-size="26" class="sans sub">Attended AI seminar</text>
  <text x="120" y="770" font-size="26" class="sans sub">Completed many certificates</text>
  <text x="120" y="815" font-size="26" class="sans sub">Member of college club</text>
  <line x1="120" y1="870" x2="520" y2="870" stroke="#c0492f" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="120" y="920" font-size="24" class="sans red">Too much detail, not enough proof.</text>

  <text x="660" y="535" font-size="30" font-weight="700" class="serif ink">Education</text>
  <text x="660" y="590" font-size="26" class="sans ink">B.Tech CSE, ABC College, 2026</text>
  <text x="660" y="635" font-size="26" class="sans ink">CGPA: 8.2/10</text>
  <circle cx="678" cy="698" r="8" fill="#2f7d4f"/>
  <text x="700" y="707" font-size="25" class="sans ink">Coursework: DBMS, OS, ML</text>
  <circle cx="678" cy="758" r="8" fill="#2f7d4f"/>
  <text x="700" y="767" font-size="25" class="sans ink">Built attendance dashboard</text>
  <text x="700" y="804" font-size="25" class="sans ink">using React + SQL</text>
  <circle cx="678" cy="864" r="8" fill="#2f7d4f"/>
  <text x="700" y="873" font-size="25" class="sans ink">Led 4-person lab project</text>
  <text x="660" y="935" font-size="24" class="sans green">Short basics. Relevant proof.</text>

  <rect x="330" y="1018" width="540" height="58" rx="29" fill="#23303a"/>
  <text x="600" y="1056" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle" class="sans">Keep lines that help shortlist you.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" class="sans">worldofinterns.in  |  practical, not promotional</text>
</svg>
