<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI cold message test</title>
  <desc id="desc">A World of Interns checklist card with four checks for writing a specific AI-assisted cold outreach message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="245" font-size="60" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">AI cold message test</text>
  <text x="84" y="302" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">Before you send the recruiter DM</text>

  <rect x="80" y="365" width="1040" height="590" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#23303a">
    <g>
      <rect x="130" y="430" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M142 454 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="210" y="470">Specific reason</text>
    </g>

    <g>
      <rect x="130" y="555" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M142 579 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="210" y="595">One proof point</text>
    </g>

    <g>
      <rect x="130" y="680" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M142 704 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="210" y="720">One small ask</text>
    </g>

    <g>
      <rect x="130" y="805" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M142 829 l13 15 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="210" y="845">No fake praise</text>
    </g>
  </g>

  <rect x="147" y="1015" width="906" height="2" fill="#d7cfbf"/>
  <text x="600" y="1085" font-size="24" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
