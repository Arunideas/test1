<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Entry-level AI-adjacent work</title>
  <desc id="desc">World of Interns card with three checklist items: map the workflow, check the output, explain the decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#23303a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="238" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Friday Future Skill / AI careers</text>
  <text x="80" y="322" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Entry-level</text>
  <text x="80" y="402" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">AI-adjacent work</text>

  <rect x="80" y="475" width="1040" height="480" rx="26" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>

  <g>
    <circle cx="150" cy="575" r="30" fill="#0b5cff"/>
    <text x="150" y="587" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="205" y="565" font-size="42" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Map the workflow</text>
    <text x="205" y="615" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">turn messy work into clear steps</text>
  </g>

  <line x1="150" y1="614" x2="150" y2="672" stroke="#d7cfbf" stroke-width="5" stroke-linecap="round"/>

  <g>
    <circle cx="150" cy="725" r="30" fill="#0b5cff"/>
    <text x="150" y="737" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="205" y="715" font-size="42" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Check the output</text>
    <text x="205" y="765" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">compare AI answers with the source</text>
  </g>

  <line x1="150" y1="764" x2="150" y2="822" stroke="#d7cfbf" stroke-width="5" stroke-linecap="round"/>

  <g>
    <circle cx="150" cy="875" r="30" fill="#0b5cff"/>
    <text x="150" y="887" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="205" y="865" font-size="42" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Explain the decision</text>
    <text x="205" y="915" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">show what is useful, risky, or missing</text>
  </g>

  <rect x="735" y="250" width="310" height="96" rx="20" fill="#0b5cff" opacity="0.10"/>
  <text x="890" y="288" font-size="24" fill="#0b5cff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">The signal is</text>
  <text x="890" y="326" font-size="36" fill="#0b5cff" font-weight="800" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">judgment</text>

  <text x="600" y="1055" font-size="31" fill="#23303a" font-weight="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">AI careers start with making AI useful, checked, and clear.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
