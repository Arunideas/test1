<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <rect x="80" y="188" width="1040" height="812" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>
  <text x="130" y="282" font-size="64" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Debug with evidence</text>
  <text x="132" y="338" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">A future skill hiring teams notice in project work.</text>

  <line x1="168" y1="438" x2="168" y2="830" stroke="#d7cfbf" stroke-width="5" stroke-linecap="round"/>

  <g>
    <circle cx="168" cy="438" r="24" fill="#0b5cff"/>
    <text x="168" y="449" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="225" y="426" font-size="38" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Reproduce the issue</text>
    <text x="225" y="474" font-size="29" fill="#5c6773" font-family="Arial, sans-serif">Same input, same steps, same result.</text>
  </g>

  <g>
    <circle cx="168" cy="568" r="24" fill="#0b5cff"/>
    <text x="168" y="579" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="225" y="556" font-size="38" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Read the exact error</text>
    <text x="225" y="604" font-size="29" fill="#5c6773" font-family="Arial, sans-serif">Copy the message before changing code.</text>
  </g>

  <g>
    <circle cx="168" cy="698" r="24" fill="#0b5cff"/>
    <text x="168" y="709" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="225" y="686" font-size="38" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Change one thing</text>
    <text x="225" y="734" font-size="29" fill="#5c6773" font-family="Arial, sans-serif">Test one assumption at a time.</text>
  </g>

  <g>
    <circle cx="168" cy="828" r="24" fill="#2f7d4f"/>
    <text x="168" y="839" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">4</text>
    <text x="225" y="816" font-size="38" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Write what fixed it</text>
    <text x="225" y="864" font-size="29" fill="#5c6773" font-family="Arial, sans-serif">Your notes become proof of how you think.</text>
  </g>

  <rect x="130" y="916" width="940" height="2" fill="#d7cfbf"/>
  <text x="130" y="956" font-size="25" fill="#5c6773" font-family="Arial, sans-serif">Internship-ready projects are not bug-free. They are explainable.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
