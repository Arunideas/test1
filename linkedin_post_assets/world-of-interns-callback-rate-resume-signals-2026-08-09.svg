<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Resume signals that help callbacks</title>
  <desc id="desc">A World of Interns weekly report card with three checklist items: problem first, role-matched skills, and proof of change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="228" font-size="28" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">SUNDAY WEEKLY REPORT</text>
  <text x="80" y="304" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Resume signals</text>
  <text x="80" y="376" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">that help callbacks</text>

  <rect x="80" y="445" width="1040" height="460" rx="26" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="124" y="506" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M137 535 l14 15 l30 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="528" font-size="36" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Problem first</text>
    <text x="215" y="576" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Name what the project or work solved.</text>
  </g>

  <line x1="130" y1="628" x2="1070" y2="628" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="124" y="683" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M137 712 l14 15 l30 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="705" font-size="36" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Role-matched skills</text>
    <text x="215" y="753" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Keep the tools that matter for this application.</text>
  </g>

  <line x1="130" y1="805" x2="1070" y2="805" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="124" y="860" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M137 889 l14 15 l30 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="882" font-size="36" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Proof of change</text>
    <text x="215" y="930" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Show what became better after your work.</text>
  </g>

  <rect x="120" y="984" width="960" height="76" rx="18" fill="#23303a"/>
  <text x="600" y="1032" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Rewrite one bullet before Monday.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
