<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Debug your thinking before the work</title>
  <desc id="desc">World of Interns card with three thinking checks: state the problem, name the assumption, test the opposite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e8e1d2"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#23303a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="232" font-size="30" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif" letter-spacing="2">FRIDAY FUTURE SKILL</text>
  <text x="80" y="330" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Debug your</text>
  <text x="80" y="414" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">thinking before</text>
  <text x="80" y="498" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">the work</text>

  <rect x="80" y="585" width="1040" height="380" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>

  <g>
    <circle cx="150" cy="680" r="34" fill="#0b5cff"/>
    <text x="150" y="693" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="215" y="672" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">State the problem</text>
    <text x="215" y="718" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">One clear line beats five vague ones.</text>
  </g>

  <line x1="150" y1="728" x2="150" y2="778" stroke="#d7cfbf" stroke-width="5" stroke-linecap="round"/>

  <g>
    <circle cx="150" cy="825" r="34" fill="#0b5cff"/>
    <text x="150" y="838" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="215" y="817" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Name the assumption</text>
    <text x="215" y="863" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Find the hidden guess in your answer.</text>
  </g>

  <line x1="150" y1="873" x2="150" y2="923" stroke="#d7cfbf" stroke-width="5" stroke-linecap="round"/>

  <g>
    <circle cx="150" cy="970" r="34" fill="#0b5cff"/>
    <text x="150" y="983" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="215" y="962" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Test the opposite</text>
    <text x="215" y="1008" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Ask what else could be true.</text>
  </g>

  <rect x="735" y="175" width="345" height="285" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <text x="777" y="235" font-size="26" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Before you submit:</text>
  <text x="777" y="306" font-size="37" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">What did I</text>
  <text x="777" y="354" font-size="37" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">not test?</text>
  <path d="M782 400 C840 430, 940 432, 1028 390" fill="none" stroke="#0b5cff" stroke-width="8" stroke-linecap="round"/>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
