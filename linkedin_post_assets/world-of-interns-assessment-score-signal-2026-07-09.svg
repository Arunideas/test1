<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Assessment score: what it really signals</title>
  <desc id="desc">World of Interns square card explaining that an assessment score is a hiring signal, with four checklist items: basic skill, role fit, interview depth, proof around the score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="232" font-size="28" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif" letter-spacing="2">RECRUITER INSIGHT</text>
  <text x="80" y="326" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Assessment score:</text>
  <text x="80" y="402" font-size="64" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">what it really signals</text>

  <rect x="80" y="480" width="1040" height="456" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(132 554)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Basic skill</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">Can the student handle the core work?</text>
    </g>

    <g transform="translate(132 658)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Role fit</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">Does the tested skill match the internship?</text>
    </g>

    <g transform="translate(132 762)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Interview depth</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">Can the conversation go beyond basics?</text>
    </g>

    <g transform="translate(132 866)">
      <rect x="0" y="-34" width="50" height="50" rx="10" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M12 -9 l13 15 l29 -36" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="5" font-size="40" fill="#23303a" font-weight="700">Proof around the score</text>
      <text x="82" y="47" font-size="24" fill="#5c6773">Do projects and resume lines support it?</text>
    </g>
  </g>

  <rect x="80" y="988" width="1040" height="72" rx="18" fill="#23303a" opacity="0.96"/>
  <text x="600" y="1034" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">A score starts the signal. Context makes it trustworthy.</text>

  <text x="600" y="1132" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
