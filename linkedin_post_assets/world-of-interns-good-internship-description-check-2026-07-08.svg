<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Good internship description check</title>
  <desc id="desc">World of Interns checklist image showing four things a good internship description should include: actual work, skills, guidance, and basic terms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="70" y="70" width="1060" height="1060" rx="36" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="105" y="105" width="50" height="50" rx="12" fill="#0b5cff"/>
    <text x="130" y="139" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="174" y="139" font-size="28" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="105" y="245" font-size="36" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Before you apply</text>
  <text x="105" y="325" font-size="72" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Read the listing</text>
  <text x="105" y="405" font-size="72" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">like a contract</text>

  <g font-family="Arial, sans-serif">
    <rect x="105" y="485" width="990" height="104" rx="22" fill="#f3efe7" stroke="#d7cfbf" stroke-width="2"/>
    <circle cx="162" cy="537" r="28" fill="#2f7d4f"/>
    <path d="M149 536 l10 11 l20 -25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="528" font-size="32" fill="#23303a" font-weight="700">Actual work</text>
    <text x="215" y="566" font-size="24" fill="#5c6773">A task, project, or outcome - not only "assist the team"</text>

    <rect x="105" y="620" width="990" height="104" rx="22" fill="#f3efe7" stroke="#d7cfbf" stroke-width="2"/>
    <circle cx="162" cy="672" r="28" fill="#2f7d4f"/>
    <path d="M149 671 l10 11 l20 -25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="663" font-size="32" fill="#23303a" font-weight="700">Relevant skills</text>
    <text x="215" y="701" font-size="24" fill="#5c6773">Clear skills you will use or learn in the role</text>

    <rect x="105" y="755" width="990" height="104" rx="22" fill="#f3efe7" stroke="#d7cfbf" stroke-width="2"/>
    <circle cx="162" cy="807" r="28" fill="#2f7d4f"/>
    <path d="M149 806 l10 11 l20 -25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="798" font-size="32" fill="#23303a" font-weight="700">Guidance</text>
    <text x="215" y="836" font-size="24" fill="#5c6773">Someone to review your work and answer questions</text>

    <rect x="105" y="890" width="990" height="104" rx="22" fill="#f3efe7" stroke="#d7cfbf" stroke-width="2"/>
    <circle cx="162" cy="942" r="28" fill="#2f7d4f"/>
    <path d="M149 941 l10 11 l20 -25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="933" font-size="32" fill="#23303a" font-weight="700">Basic terms</text>
    <text x="215" y="971" font-size="24" fill="#5c6773">Duration, stipend, location, work hours, selection process</text>
  </g>

  <rect x="105" y="1030" width="990" height="62" rx="18" fill="#0b5cff" opacity="0.08"/>
  <text x="600" y="1071" font-size="27" fill="#23303a" font-weight="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Clear expectations beat fancy words.</text>

  <text x="600" y="1128" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
