<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Read numbers before you react</title>
  <desc id="desc">World of Interns checklist card with four questions for reading data carefully before making a claim.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="238" font-size="34" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">FRIDAY FUTURE SKILL</text>
  <text x="80" y="330" font-size="76" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Read numbers</text>
  <text x="80" y="418" font-size="76" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">before you react</text>

  <rect x="80" y="500" width="1040" height="470" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#shadow)"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(135 585)">
      <circle cx="22" cy="-10" r="24" fill="#0b5cff"/>
      <text x="22" y="3" font-size="32" fill="#ffffff" font-weight="800" text-anchor="middle">1</text>
      <text x="74" y="5" font-size="40" fill="#23303a" font-weight="700">What was counted?</text>
      <text x="74" y="45" font-size="26" fill="#5c6773">Find the base before trusting the chart.</text>
    </g>

    <g transform="translate(135 690)">
      <circle cx="22" cy="-10" r="24" fill="#0b5cff"/>
      <text x="22" y="3" font-size="32" fill="#ffffff" font-weight="800" text-anchor="middle">2</text>
      <text x="74" y="5" font-size="40" fill="#23303a" font-weight="700">What was ignored?</text>
      <text x="74" y="45" font-size="26" fill="#5c6773">Look for missing rows, groups, or context.</text>
    </g>

    <g transform="translate(135 795)">
      <circle cx="22" cy="-10" r="24" fill="#0b5cff"/>
      <text x="22" y="3" font-size="32" fill="#ffffff" font-weight="800" text-anchor="middle">3</text>
      <text x="74" y="5" font-size="40" fill="#23303a" font-weight="700">Who collected it?</text>
      <text x="74" y="45" font-size="26" fill="#5c6773">Source changes how strong the claim is.</text>
    </g>

    <g transform="translate(135 900)">
      <circle cx="22" cy="-10" r="24" fill="#0b5cff"/>
      <text x="22" y="3" font-size="32" fill="#ffffff" font-weight="800" text-anchor="middle">4</text>
      <text x="74" y="5" font-size="40" fill="#23303a" font-weight="700">What changed?</text>
      <text x="74" y="45" font-size="26" fill="#5c6773">Compare before you explain.</text>
    </g>
  </g>

  <text x="600" y="1085" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  |  practical, not promotional</text>
</svg>
