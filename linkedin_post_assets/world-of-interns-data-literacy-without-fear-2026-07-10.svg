<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Data literacy without fear</title>
  <desc id="desc">World of Interns brand card showing a four-step data literacy check for students.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="238" font-size="42" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Friday Future Skill</text>
  <text x="80" y="322" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Data literacy</text>
  <text x="80" y="398" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">without fear</text>

  <rect x="80" y="475" width="1040" height="456" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <line x1="168" y1="550" x2="168" y2="858" stroke="#d7cfbf" stroke-width="5"/>

  <circle cx="168" cy="550" r="31" fill="#0b5cff"/>
  <text x="168" y="563" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="225" y="562" font-size="36" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Read the table before the headline.</text>

  <circle cx="168" cy="654" r="31" fill="#0b5cff"/>
  <text x="168" y="667" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="225" y="666" font-size="36" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Ask what was counted.</text>

  <circle cx="168" cy="758" r="31" fill="#0b5cff"/>
  <text x="168" y="771" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="225" y="770" font-size="36" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Spot the missing context.</text>

  <circle cx="168" cy="862" r="31" fill="#0b5cff"/>
  <text x="168" y="875" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">4</text>
  <text x="225" y="874" font-size="36" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Decide what you still cannot conclude.</text>

  <rect x="80" y="976" width="1040" height="76" rx="18" fill="#23303a"/>
  <text x="600" y="1024" font-size="31" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Useful in marketing, HR, operations, product, and research internships.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
