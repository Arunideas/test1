<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="World of Interns checklist visual: read the stipend range before applying">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="265" font-size="64" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Read the stipend</text>
  <text x="80" y="342" font-size="64" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">line before applying</text>
  <text x="82" y="410" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">Do not plan around only the top number.</text>

  <rect x="80" y="500" width="520" height="360" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <text x="120" y="575" font-size="32" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">Listing says</text>
  <text x="120" y="675" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Rs 5,000</text>
  <text x="120" y="745" font-size="40" fill="#5c6773" font-family="Arial, sans-serif">to</text>
  <text x="185" y="745" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Rs 20,000</text>
  <text x="120" y="815" font-size="30" fill="#c0492f" font-weight="700" font-family="Arial, sans-serif">Verify what is fixed.</text>

  <g>
    <circle cx="710" cy="535" r="28" fill="#0b5cff"/>
    <text x="710" y="546" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="760" y="546" font-size="34" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Fixed vs variable</text>
  </g>
  <g>
    <circle cx="710" cy="625" r="28" fill="#0b5cff"/>
    <text x="710" y="636" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="760" y="636" font-size="34" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Payout cycle</text>
  </g>
  <g>
    <circle cx="710" cy="715" r="28" fill="#0b5cff"/>
    <text x="710" y="726" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="760" y="726" font-size="34" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Hours and duration</text>
  </g>
  <g>
    <circle cx="710" cy="805" r="28" fill="#0b5cff"/>
    <text x="710" y="816" font-size="30" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">4</text>
    <text x="760" y="816" font-size="34" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Training terms</text>
  </g>

  <rect x="82" y="930" width="1038" height="92" rx="18" fill="#23303a"/>
  <text x="600" y="987" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Ask before you spend a week in the process.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
