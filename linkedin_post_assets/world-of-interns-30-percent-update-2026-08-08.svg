<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The 30 percent update</title>
  <desc id="desc">World of Interns checklist card with four lines interns can share before going too deep into a task: direction I am taking, what is already working, what is still uncertain, and decision I need checked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e8dfd0"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2b2116" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paperNoise)" opacity="0.08"/>

  <g>
    <rect x="82" y="78" width="48" height="48" rx="11" fill="#0b5cff"/>
    <text x="106" y="111" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="148" y="112" font-size="27" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <rect x="110" y="185" width="980" height="845" rx="30" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>

  <text x="160" y="285" font-size="36" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Show direction early</text>
  <text x="160" y="365" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">The 30 percent</text>
  <text x="160" y="438" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">update</text>

  <line x1="160" y1="492" x2="1040" y2="492" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(160 575)">
      <rect x="0" y="-34" width="44" height="44" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -12 L21 1 L36 -23" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a">Direction I am taking</text>
    </g>

    <g transform="translate(160 700)">
      <rect x="0" y="-34" width="44" height="44" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -12 L21 1 L36 -23" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a">What is already working</text>
    </g>

    <g transform="translate(160 825)">
      <rect x="0" y="-34" width="44" height="44" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -12 L21 1 L36 -23" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a">What is still uncertain</text>
    </g>

    <g transform="translate(160 950)">
      <rect x="0" y="-34" width="44" height="44" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -12 L21 1 L36 -23" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a">Decision I need checked</text>
    </g>
  </g>

  <text x="600" y="1128" font-size="23" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  |  practical, not promotional</text>
</svg>
