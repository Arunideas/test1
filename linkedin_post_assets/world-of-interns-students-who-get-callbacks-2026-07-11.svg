<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Students who get callbacks</title>
  <desc id="desc">A World of Interns checklist card showing five habits: fewer roles, clear match, outcome bullets, proof link, and one polite follow-up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="260" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Students who get</text>
  <text x="80" y="332" font-size="58" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">callbacks</text>
  <text x="80" y="392" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">The pattern is usually practical, not flashy.</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#23303a">
    <g>
      <rect x="80" y="484" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M90 506 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="150" y="516">Apply to fewer, better-fit roles</text>
    </g>
    <g>
      <rect x="80" y="604" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M90 626 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="150" y="636">Match each project to the role</text>
    </g>
    <g>
      <rect x="80" y="724" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M90 746 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="150" y="756">Write outcomes, not duties</text>
    </g>
    <g>
      <rect x="80" y="844" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M90 866 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="150" y="876">Keep one proof link ready</text>
    </g>
    <g>
      <rect x="80" y="964" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M90 986 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="150" y="996">Follow up once, politely</text>
    </g>
  </g>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
