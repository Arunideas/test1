<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Experience bullet proof check</title>
  <desc id="desc">Before and after card showing a vague experience duty rewritten into a proof-backed resume bullet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e8e0d2"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6a5f4f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.07"/>

  <g>
    <rect x="80" y="74" width="48" height="48" rx="10" fill="#0b5cff"/>
    <text x="104" y="108" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="144" y="107" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="205" font-size="25" fill="#0b5cff" font-weight="800" letter-spacing="2" font-family="Arial, sans-serif">RESUME REVIEW</text>
  <text x="80" y="285" font-size="64" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Do not list duties.</text>
  <text x="80" y="361" font-size="64" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Show proof.</text>
  <text x="80" y="425" font-size="30" fill="#5c6773" font-weight="500" font-family="Arial, sans-serif">Turn one experience bullet into context,</text>
  <text x="80" y="467" font-size="30" fill="#5c6773" font-weight="500" font-family="Arial, sans-serif">action, tool, and result.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="525" width="490" height="440" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <rect x="630" y="525" width="490" height="440" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  </g>

  <text x="120" y="590" font-size="30" fill="#c0492f" font-weight="800" font-family="Arial, sans-serif">BEFORE</text>
  <text x="670" y="590" font-size="30" fill="#2f7d4f" font-weight="800" font-family="Arial, sans-serif">AFTER</text>

  <line x1="120" y1="625" x2="530" y2="625" stroke="#d7cfbf" stroke-width="3"/>
  <line x1="670" y1="625" x2="1080" y2="625" stroke="#d7cfbf" stroke-width="3"/>

  <text x="128" y="695" font-size="38" fill="#5c6773" font-weight="800" font-family="Arial, sans-serif">Worked on</text>
  <text x="128" y="747" font-size="38" fill="#5c6773" font-weight="800" font-family="Arial, sans-serif">social media posts</text>
  <text x="128" y="835" font-size="27" fill="#c0492f" font-weight="700" font-family="Arial, sans-serif">The recruiter still asks:</text>
  <text x="128" y="879" font-size="29" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">What did you do?</text>
  <text x="128" y="923" font-size="29" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">How often?</text>
  <text x="128" y="967" font-size="29" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">What changed?</text>

  <text x="680" y="675" font-size="29" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Planned 12 posts</text>
  <text x="680" y="720" font-size="25" fill="#5c6773" font-weight="600" font-family="Arial, sans-serif">for a campus fest team</text>
  <text x="680" y="790" font-size="29" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">using Canva + calendar</text>
  <text x="680" y="835" font-size="25" fill="#5c6773" font-weight="600" font-family="Arial, sans-serif">to keep posts on schedule</text>
  <text x="680" y="905" font-size="29" fill="#2f7d4f" font-weight="800" font-family="Arial, sans-serif">for 3 weeks.</text>

  <rect x="675" y="928" width="335" height="44" rx="22" fill="#e5f2ea"/>
  <text x="842" y="958" font-size="22" fill="#2f7d4f" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">clear, honest proof</text>

  <rect x="80" y="1015" width="1040" height="2" fill="#d7cfbf"/>
  <text x="600" y="1088" font-size="25" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
