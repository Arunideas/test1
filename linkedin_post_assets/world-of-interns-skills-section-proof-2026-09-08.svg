<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Skills section proof checklist</title>
  <desc id="desc">A World of Interns checklist-style image comparing an overcrowded skills section with a cleaner skills-plus-proof version.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2733" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="222" font-size="58" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Your skills section</text>
  <text x="80" y="292" font-size="58" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">needs proof, not volume.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="370" width="1040" height="230" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <rect x="110" y="405" width="132" height="42" rx="21" fill="#f7dfd9"/>
    <text x="176" y="434" font-size="24" fill="#c0492f" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">BEFORE</text>
    <text x="110" y="505" font-size="34" fill="#5c6773" font-family="Arial, sans-serif">Python, SQL, Excel, Tableau, Power BI, ML,</text>
    <text x="110" y="552" font-size="34" fill="#5c6773" font-family="Arial, sans-serif">Communication, Leadership...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="650" width="1040" height="330" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <rect x="110" y="685" width="102" height="42" rx="21" fill="#dff0e6"/>
    <text x="161" y="714" font-size="24" fill="#2f7d4f" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">AFTER</text>

    <circle cx="126" cy="785" r="24" fill="#0b5cff"/>
    <text x="126" y="794" font-size="25" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="170" y="792" font-size="32" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Pick fewer skills.</text>

    <circle cx="126" cy="865" r="24" fill="#0b5cff"/>
    <text x="126" y="874" font-size="25" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="170" y="872" font-size="32" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Attach project or internship proof.</text>

    <circle cx="126" cy="945" r="24" fill="#0b5cff"/>
    <text x="126" y="954" font-size="25" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="170" y="952" font-size="32" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Show one result, number, or outcome.</text>
  </g>

  <text x="600" y="1092" font-size="28" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
