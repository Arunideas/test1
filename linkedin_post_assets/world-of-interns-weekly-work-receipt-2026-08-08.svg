<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The weekly work receipt</title>
  <desc id="desc">World of Interns checklist card with four items: task touched, decision made, proof saved, lesson learned.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="260" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">SATURDAY STUDENT STORY</text>
  <text x="80" y="350" font-size="72" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">The weekly</text>
  <text x="80" y="435" font-size="72" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">work receipt</text>

  <rect x="80" y="510" width="1040" height="470" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#23303a">
    <rect x="130" y="580" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 600 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="200" y="615" font-size="40">Task touched</text>
    <text x="200" y="657" font-size="24" fill="#5c6773" font-family="Arial, sans-serif">What did you actually work on?</text>

    <rect x="130" y="690" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 710 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="200" y="725" font-size="40">Decision made</text>
    <text x="200" y="767" font-size="24" fill="#5c6773" font-family="Arial, sans-serif">What choice did you own?</text>

    <rect x="130" y="800" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 820 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="200" y="835" font-size="40">Proof saved</text>
    <text x="200" y="877" font-size="24" fill="#5c6773" font-family="Arial, sans-serif">Screenshot, number, link, or result.</text>

    <rect x="130" y="910" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 930 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="200" y="945" font-size="40">Lesson learned</text>
  </g>

  <text x="80" y="1068" font-size="30" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Save evidence before the memory fades.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
