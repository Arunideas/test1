<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Turn theory into practical skill</title>
  <desc id="desc">World of Interns card showing theory notes being turned into practical proof through one small project, one test, and one improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe3"/>
      <stop offset="1" stop-color="#e9dfcd"/>
    </linearGradient>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paper)" opacity="0.22"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="245" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">FRIDAY FUTURE SKILL</text>
  <text x="80" y="335" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Turn theory</text>
  <text x="80" y="420" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">into proof</text>

  <rect x="80" y="505" width="1040" height="405" rx="30" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <rect x="135" y="585" width="255" height="235" rx="24" fill="#ffffff" stroke="#d7cfbf" stroke-width="3"/>
  <text x="263" y="655" font-size="31" fill="#23303a" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">Theory</text>
  <path d="M185 700 H340" stroke="#c9bfac" stroke-width="8" stroke-linecap="round"/>
  <path d="M185 745 H318" stroke="#c9bfac" stroke-width="8" stroke-linecap="round"/>
  <path d="M185 790 H290" stroke="#c9bfac" stroke-width="8" stroke-linecap="round"/>

  <path d="M415 705 C470 650, 540 650, 595 705" fill="none" stroke="#0b5cff" stroke-width="8" stroke-linecap="round"/>
  <path d="M575 674 L603 708 L558 706" fill="#0b5cff"/>
  <text x="505" y="780" font-size="25" fill="#5c6773" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">use it</text>

  <rect x="620" y="585" width="255" height="235" rx="24" fill="#ffffff" stroke="#d7cfbf" stroke-width="3"/>
  <text x="748" y="650" font-size="31" fill="#23303a" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">Small proof</text>
  <rect x="680" y="700" width="135" height="86" rx="14" fill="#eaf1ff" stroke="#0b5cff" stroke-width="4"/>
  <path d="M710 745 L740 770 L790 715" fill="none" stroke="#2f7d4f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="945" cy="628" r="34" fill="#0b5cff"/>
  <text x="945" y="641" font-size="28" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="995" y="640" font-size="28" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Project</text>

  <circle cx="945" cy="716" r="34" fill="#2f7d4f"/>
  <text x="945" y="729" font-size="28" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="995" y="728" font-size="28" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Test</text>

  <circle cx="945" cy="804" r="34" fill="#c0492f"/>
  <text x="945" y="817" font-size="28" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="995" y="816" font-size="28" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Improve</text>

  <rect x="80" y="965" width="1040" height="84" rx="20" fill="#23303a"/>
  <text x="600" y="1018" font-size="31" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Practical skill is theory under pressure.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in | practical, not promotional</text>
</svg>
