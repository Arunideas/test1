<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI project interview drill</title>
  <desc id="desc">A World of Interns checklist card with four steps for using AI to practise project interview answers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paper-grain)" opacity="0.08"/>
  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="88" y="174" width="1024" height="876" rx="30" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  </g>
  <text x="130" y="276" font-size="62" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">AI project</text>
  <text x="130" y="350" font-size="62" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">interview drill</text>
  <line x1="130" y1="392" x2="1070" y2="392" stroke="#d7cfbf" stroke-width="4"/>
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="132" y="456" width="52" height="52" rx="10" fill="none" stroke="#23303a" stroke-width="5"/>
      <path d="M144 482 l14 16 l34 -42" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="214" y="493" font-size="38" fill="#23303a" font-weight="700">Paste project summary</text>
      <text x="214" y="537" font-size="27" fill="#5c6773">Only your real work, not a polished story.</text>
    </g>
    <g>
      <rect x="132" y="606" width="52" height="52" rx="10" fill="none" stroke="#23303a" stroke-width="5"/>
      <path d="M144 632 l14 16 l34 -42" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="214" y="643" font-size="38" fill="#23303a" font-weight="700">Ask interviewer questions</text>
      <text x="214" y="687" font-size="27" fill="#5c6773">Problem, role, trade-off, result.</text>
    </g>
    <g>
      <rect x="132" y="756" width="52" height="52" rx="10" fill="none" stroke="#23303a" stroke-width="5"/>
      <path d="M144 782 l14 16 l34 -42" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="214" y="793" font-size="38" fill="#23303a" font-weight="700">Answer aloud first</text>
      <text x="214" y="837" font-size="27" fill="#5c6773">Read AI suggestions only after you try.</text>
    </g>
    <g>
      <rect x="132" y="906" width="52" height="52" rx="10" fill="none" stroke="#23303a" stroke-width="5"/>
      <path d="M144 932 l14 16 l34 -42" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="214" y="943" font-size="38" fill="#23303a" font-weight="700">Fix weak proof</text>
      <text x="214" y="987" font-size="27" fill="#5c6773">Use code, data, feedback, or a clear decision.</text>
    </g>
  </g>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
