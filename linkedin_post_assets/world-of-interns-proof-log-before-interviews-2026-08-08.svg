<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Build a proof log before interviews</title>
  <desc id="desc">World of Interns checklist card with three prompts: problem touched, action taken, and what changed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paper-grain)" opacity="0.08"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="255" font-size="64" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Build a proof log</text>
  <text x="80" y="330" font-size="64" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">before interviews</text>
  <text x="82" y="392" font-size="30" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Save the small details while the work is still fresh.</text>

  <rect x="80" y="470" width="1040" height="420" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g>
    <rect x="130" y="535" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M141 560 l13 15 l27 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="568" font-size="39" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">What problem did I touch?</text>
    <text x="205" y="612" font-size="25" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">One clear situation, not a full story.</text>
  </g>

  <g>
    <rect x="130" y="650" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M141 675 l13 15 l27 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="683" font-size="39" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">What did I actually do?</text>
    <text x="205" y="727" font-size="25" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Use verbs: cleaned, grouped, tested, shipped.</text>
  </g>

  <g>
    <rect x="130" y="765" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M141 790 l13 15 l27 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="798" font-size="39" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">What changed after that?</text>
    <text x="205" y="842" font-size="25" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">A number, a result, or a better next step.</text>
  </g>

  <rect x="80" y="950" width="1040" height="88" rx="18" fill="#23303a"/>
  <text x="600" y="1006" font-size="32" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Real proof makes interview answers easier to trust.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
