<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday job-readiness score check</title>
  <desc id="desc">A World of Interns card showing four visible proof signals to review before Monday internship applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2b2118" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="224" font-size="30" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">SUNDAY WEEKLY REPORT</text>
  <text x="80" y="312" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Job-readiness</text>
  <text x="80" y="392" font-size="70" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">score check</text>

  <rect x="80" y="480" width="1040" height="470" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>
  <line x1="600" y1="545" x2="600" y2="880" stroke="#d7cfbf" stroke-width="3"/>

  <text x="160" y="565" font-size="31" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">ROLE ASKS FOR</text>
  <text x="660" y="565" font-size="31" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">VISIBLE PROOF</text>

  <g font-family="Arial, sans-serif" font-size="34" fill="#23303a">
    <circle cx="150" cy="650" r="11" fill="#c0492f"/>
    <text x="180" y="662">Skill requirement</text>
    <circle cx="150" cy="730" r="11" fill="#c0492f"/>
    <text x="180" y="742">Project experience</text>
    <circle cx="150" cy="810" r="11" fill="#c0492f"/>
    <text x="180" y="822">Relevant outcome</text>

    <rect x="660" y="623" width="34" height="34" rx="7" fill="none" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M668 640 l10 12 l22 -28" fill="none" stroke="#2f7d4f" stroke-width="5" stroke-linecap="round"/>
    <text x="715" y="652">Matching skill</text>

    <rect x="660" y="703" width="34" height="34" rx="7" fill="none" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M668 720 l10 12 l22 -28" fill="none" stroke="#2f7d4f" stroke-width="5" stroke-linecap="round"/>
    <text x="715" y="732">Proof project</text>

    <rect x="660" y="783" width="34" height="34" rx="7" fill="none" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M668 800 l10 12 l22 -28" fill="none" stroke="#2f7d4f" stroke-width="5" stroke-linecap="round"/>
    <text x="715" y="812">Concrete detail</text>
  </g>

  <rect x="145" y="900" width="910" height="92" rx="18" fill="#e9f0ff" stroke="#c7d8ff" stroke-width="2"/>
  <text x="600" y="958" font-size="34" fill="#23303a" font-weight="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Can a recruiter see the proof in 7 seconds?</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
