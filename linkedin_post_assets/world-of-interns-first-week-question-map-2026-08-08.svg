<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">First week question map</title>
  <desc id="desc">A World of Interns checklist card with four prompts for asking better questions at work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="paperGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paperGrain)" opacity="0.1"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <rect x="76" y="176" width="1048" height="866" rx="34" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#softShadow)"/>
  <text x="120" y="262" font-size="34" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif" letter-spacing="2">FIRST INTERNSHIP QUESTION CHECK</text>
  <text x="120" y="356" font-size="76" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">First week</text>
  <text x="120" y="442" font-size="76" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">question map.</text>

  <line x1="120" y1="505" x2="1080" y2="505" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(120 568)">
      <rect x="0" y="-34" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -14 l12 14 l25 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a" font-weight="700">Goal.</text>
      <text x="220" y="0" font-size="42" fill="#23303a">What am I trying to finish?</text>
      <text x="70" y="44" font-size="27" fill="#5c6773">Start with the outcome, not the confusion.</text>
    </g>

    <g transform="translate(120 692)">
      <rect x="0" y="-34" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -14 l12 14 l25 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a" font-weight="700">Tried.</text>
      <text x="220" y="0" font-size="42" fill="#23303a">What did I already check?</text>
      <text x="70" y="44" font-size="27" fill="#5c6773">Show the page, file, note, or example you used.</text>
    </g>

    <g transform="translate(120 816)">
      <rect x="0" y="-34" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -14 l12 14 l25 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a" font-weight="700">Options.</text>
      <text x="280" y="0" font-size="42" fill="#23303a">Which two paths do I see?</text>
      <text x="70" y="44" font-size="27" fill="#5c6773">Bring a small comparison, even if it is rough.</text>
    </g>

    <g transform="translate(120 940)">
      <rect x="0" y="-34" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -14 l12 14 l25 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="0" font-size="42" fill="#23303a" font-weight="700">Ask.</text>
      <text x="200" y="0" font-size="42" fill="#23303a">What decision do I need?</text>
      <text x="70" y="44" font-size="27" fill="#5c6773">Make it easy for someone to answer fast.</text>
    </g>
  </g>

  <text x="600" y="1128" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
