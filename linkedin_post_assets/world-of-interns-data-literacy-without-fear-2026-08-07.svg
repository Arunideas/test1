<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Data literacy without fear</title>
  <desc id="desc">A World of Interns checklist card with four beginner data literacy prompts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="250" font-size="66" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Data literacy</text>
  <text x="80" y="330" font-size="66" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">without fear</text>
  <text x="82" y="385" font-size="30" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Start with questions, not formulas.</text>

  <g>
    <rect x="80" y="470" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 492 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="500" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Read the table</text>
  </g>

  <g>
    <rect x="80" y="620" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 642 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="650" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Question the spike</text>
  </g>

  <g>
    <rect x="80" y="770" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 792 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="800" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Separate trend from cause</text>
  </g>

  <g>
    <rect x="80" y="920" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M90 942 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="150" y="950" font-size="42" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Ask what is missing</text>
  </g>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
