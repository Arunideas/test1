<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday proof gap audit</title>
  <desc id="desc">A World of Interns checklist card with three steps: role skill, proof shown, and proof gap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e7dfd0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2b2417" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.22"/>

  <g transform="translate(80 80)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="23" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">W</text>
    <text x="62" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#23303a">World of Interns</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="105" y="178" width="990" height="820" rx="34" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="105" y1="322" x2="1095" y2="322" stroke="#d7cfbf" stroke-width="3"/>
  </g>

  <text x="150" y="260" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#0b5cff">SUNDAY REVIEW</text>
  <text x="150" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#23303a">Proof gap audit</text>
  <text x="150" y="476" font-family="Arial, sans-serif" font-size="31" fill="#5c6773">Before Monday applications, check the evidence.</text>

  <g transform="translate(150 565)">
    <rect x="0" y="-36" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M13 -8 l14 16 l30 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="0" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#23303a">Role skill</text>
    <text x="84" y="48" font-family="Arial, sans-serif" font-size="29" fill="#5c6773">What did the internship ask for?</text>
  </g>

  <g transform="translate(150 710)">
    <rect x="0" y="-36" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M13 -8 l14 16 l30 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="0" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#23303a">Proof shown</text>
    <text x="84" y="48" font-family="Arial, sans-serif" font-size="29" fill="#5c6773">Which project, sample, or result proved it?</text>
  </g>

  <g transform="translate(150 855)">
    <rect x="0" y="-36" width="56" height="56" rx="12" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M13 -8 l14 16 l30 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="0" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#23303a">Proof gap</text>
    <text x="84" y="48" font-family="Arial, sans-serif" font-size="29" fill="#5c6773">Fix one missing line before sending more.</text>
  </g>

  <g transform="translate(735 565)">
    <rect x="0" y="0" width="260" height="260" rx="28" fill="#edf3ff" stroke="#c9d9ff" stroke-width="3"/>
    <text x="130" y="104" font-family="Arial, sans-serif" font-size="84" font-weight="800" text-anchor="middle" fill="#0b5cff">1</text>
    <text x="130" y="156" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#23303a">gap to fix</text>
    <text x="130" y="202" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#5c6773">today</text>
  </g>

  <text x="600" y="1128" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#5c6773">worldofinterns.in  -  practical, not promotional</text>
</svg>
