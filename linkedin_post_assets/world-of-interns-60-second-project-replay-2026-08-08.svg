<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">60-second project replay</title>
  <desc id="desc">A World of Interns checklist card with five prompts students can use to explain a project clearly before interviews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1010" cy="180" r="112" fill="#22c55e" opacity="0.12"/>
  <circle cx="165" cy="1015" r="155" fill="#2563eb" opacity="0.10"/>
  <path d="M90 238 C240 152, 410 160, 560 258" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.32"/>
  <path d="M828 960 C918 878, 1015 870, 1115 928" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" opacity="0.32"/>

  <g filter="url(#shadow)">
    <rect x="132" y="126" width="936" height="948" rx="54" fill="#ffffff"/>
  </g>

  <rect x="132" y="126" width="936" height="948" rx="54" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="196" y="194" width="808" height="120" rx="30" fill="#0f172a"/>
  <text x="236" y="245" fill="#c7d2fe" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2">WORLD OF INTERNS</text>
  <text x="236" y="292" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Student Story: explain before polish</text>

  <text x="196" y="406" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900">60-second</text>
  <text x="196" y="478" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900">project replay</text>
  <text x="196" y="538" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="500">Before you apply, check if you can explain the work clearly.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    <g transform="translate(196 628)">
      <rect x="0" y="-39" width="808" height="76" rx="22" fill="#eff6ff"/>
      <circle cx="38" cy="0" r="20" fill="#2563eb"/>
      <text x="38" y="12" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">1</text>
      <text x="82" y="11">What problem did it solve?</text>
    </g>
    <g transform="translate(196 724)">
      <rect x="0" y="-39" width="808" height="76" rx="22" fill="#f8fafc"/>
      <circle cx="38" cy="0" r="20" fill="#0f172a"/>
      <text x="38" y="12" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">2</text>
      <text x="82" y="11">Who was it for?</text>
    </g>
    <g transform="translate(196 820)">
      <rect x="0" y="-39" width="808" height="76" rx="22" fill="#f0fdf4"/>
      <circle cx="38" cy="0" r="20" fill="#059669"/>
      <text x="38" y="12" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">3</text>
      <text x="82" y="11">What part did I build?</text>
    </g>
    <g transform="translate(196 916)">
      <rect x="0" y="-39" width="808" height="76" rx="22" fill="#fff7ed"/>
      <circle cx="38" cy="0" r="20" fill="#f97316"/>
      <text x="38" y="12" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">4</text>
      <text x="82" y="11">What trade-off did I make?</text>
    </g>
    <g transform="translate(196 1012)">
      <rect x="0" y="-39" width="808" height="76" rx="22" fill="#f8fafc"/>
      <circle cx="38" cy="0" r="20" fill="#0f172a"/>
      <text x="38" y="12" fill="#ffffff" font-size="27" font-weight="900" text-anchor="middle">5</text>
      <text x="82" y="11">What changed after it worked?</text>
    </g>
  </g>

  <text x="196" y="1126" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">A quick habit for calmer project interviews.</text>
  <text x="1004" y="1126" text-anchor="end" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">worldofinterns.com</text>
</svg>
