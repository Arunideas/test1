<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Two-sentence reflection note</title>
  <desc id="desc">A World of Interns checklist card with two prompts students can answer after a project or internship task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1018" cy="188" r="124" fill="#22c55e" opacity="0.12"/>
  <circle cx="166" cy="1002" r="148" fill="#2563eb" opacity="0.10"/>
  <path d="M82 236 C238 152, 410 166, 560 260" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.30"/>
  <path d="M826 966 C922 872, 1020 872, 1118 932" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" opacity="0.30"/>

  <g filter="url(#shadow)">
    <rect x="132" y="126" width="936" height="948" rx="54" fill="#ffffff"/>
  </g>

  <rect x="132" y="126" width="936" height="948" rx="54" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="196" y="194" width="808" height="120" rx="30" fill="#0f172a"/>
  <text x="236" y="245" fill="#c7d2fe" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2">WORLD OF INTERNS</text>
  <text x="236" y="292" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Student Story: capture the learning</text>

  <text x="196" y="406" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="900">Two-sentence</text>
  <text x="196" y="478" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="900">reflection note</text>
  <text x="196" y="538" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="500">After a task, write the details before they fade.</text>

  <g transform="translate(196 626)">
    <rect x="0" y="0" width="808" height="166" rx="30" fill="#eff6ff"/>
    <circle cx="56" cy="56" r="26" fill="#2563eb"/>
    <text x="56" y="67" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900" text-anchor="middle">1</text>
    <text x="104" y="52" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">What changed because</text>
    <text x="104" y="96" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">of the work?</text>
    <text x="104" y="138" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600">Outcome first. Feature second.</text>
  </g>

  <g transform="translate(196 826)">
    <rect x="0" y="0" width="808" height="166" rx="30" fill="#f0fdf4"/>
    <circle cx="56" cy="56" r="26" fill="#059669"/>
    <text x="56" y="67" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900" text-anchor="middle">2</text>
    <text x="104" y="52" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">What would I improve</text>
    <text x="104" y="96" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">with one more hour?</text>
    <text x="104" y="138" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600">Judgment makes the story clearer.</text>
  </g>

  <rect x="196" y="1028" width="808" height="1" fill="#e2e8f0"/>
  <text x="196" y="1084" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">A small habit for calmer project interviews.</text>
  <text x="1004" y="1084" text-anchor="end" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">worldofinterns.com</text>
</svg>
