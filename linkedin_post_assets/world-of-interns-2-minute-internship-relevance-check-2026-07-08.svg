<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">2-minute internship check</title>
  <desc id="desc">A World of Interns checklist card for checking internship relevance before applying.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6f6658" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <rect x="95" y="184" width="1010" height="850" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#shadow)"/>
  <rect x="130" y="224" width="940" height="94" rx="18" fill="#eef3ff"/>
  <text x="160" y="281" font-size="34" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Before you apply</text>

  <text x="130" y="410" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">2-minute</text>
  <text x="130" y="485" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">internship check</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(130 590)">
      <rect x="0" y="-38" width="42" height="42" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M9 -18 L19 -6 L36 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="-6" font-size="38" fill="#23303a" font-weight="700">Actual work is clear</text>
    </g>
    <g transform="translate(130 710)">
      <rect x="0" y="-38" width="42" height="42" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M9 -18 L19 -6 L36 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="-6" font-size="38" fill="#23303a" font-weight="700">Skills match your resume</text>
    </g>
    <g transform="translate(130 830)">
      <rect x="0" y="-38" width="42" height="42" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M9 -18 L19 -6 L36 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="-6" font-size="38" fill="#23303a" font-weight="700">Review owner is named</text>
    </g>
    <g transform="translate(130 950)">
      <rect x="0" y="-38" width="42" height="42" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M9 -18 L19 -6 L36 -31" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="-6" font-size="38" fill="#23303a" font-weight="700">First 2 weeks make sense</text>
    </g>
  </g>

  <text x="600" y="1128" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
