<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI cold email check for internship applications</title>
  <desc id="desc">A World of Interns checklist card for students rewriting internship cold emails with AI while keeping a natural voice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10253f"/>
      <stop offset="0.56" stop-color="#173b5f"/>
      <stop offset="1" stop-color="#0f5f68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#06111f" flood-opacity="0.28"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .brand { fill: #f6c65b; font-weight: 800; letter-spacing: 0.08em; }
      .small { fill: #eaf2f8; font-weight: 700; }
      .title { fill: #10253f; font-weight: 850; }
      .body { fill: #30445a; font-weight: 650; }
      .muted { fill: #667789; font-weight: 600; }
      .pillText { fill: #10253f; font-weight: 800; }
      .number { fill: #f6c65b; font-weight: 850; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1020" cy="170" r="170" fill="#f6c65b" opacity="0.13"/>
  <circle cx="160" cy="1015" r="230" fill="#68d6c6" opacity="0.11"/>
  <path d="M96 238 C240 124, 404 110, 558 174" fill="none" stroke="#f6c65b" stroke-width="8" stroke-linecap="round" opacity="0.34"/>
  <path d="M744 1036 C872 954, 1018 946, 1118 1004" fill="none" stroke="#68d6c6" stroke-width="8" stroke-linecap="round" opacity="0.33"/>

  <g transform="translate(96 92)">
    <text class="sans brand" x="0" y="0" font-size="28">WORLD OF INTERNS</text>
    <text class="sans small" x="0" y="52" font-size="30">Monday AI Tool</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="118" y="190" width="964" height="810" rx="52" fill="#fffaf0"/>
    <rect x="118" y="190" width="964" height="810" rx="52" fill="none" stroke="#f6c65b" stroke-width="5"/>
  </g>

  <g transform="translate(176 252)">
    <rect x="0" y="0" width="300" height="54" rx="27" fill="#d9f6f1"/>
    <text class="sans pillText" x="32" y="36" font-size="24">For internship outreach</text>

    <text class="sans title" x="0" y="135" font-size="76">AI cold email</text>
    <text class="sans title" x="0" y="222" font-size="76">check.</text>

    <text class="sans muted" x="0" y="294" font-size="31">Before you send the polished draft,</text>
    <text class="sans muted" x="0" y="338" font-size="31">make it sound like a real student.</text>

    <g transform="translate(0 420)">
      <rect x="0" y="0" width="840" height="86" rx="24" fill="#f1eadc"/>
      <circle cx="43" cy="43" r="23" fill="#10253f"/>
      <text class="sans number" x="35" y="52" font-size="25">1</text>
      <text class="sans body" x="90" y="54" font-size="32">Would I say this aloud?</text>

      <rect x="0" y="108" width="840" height="86" rx="24" fill="#f1eadc"/>
      <circle cx="43" cy="151" r="23" fill="#10253f"/>
      <text class="sans number" x="34" y="160" font-size="25">2</text>
      <text class="sans body" x="90" y="162" font-size="32">One real reason for reaching out</text>

      <rect x="0" y="216" width="840" height="86" rx="24" fill="#f1eadc"/>
      <circle cx="43" cy="259" r="23" fill="#10253f"/>
      <text class="sans number" x="34" y="268" font-size="25">3</text>
      <text class="sans body" x="90" y="270" font-size="32">One clear ask, not three</text>

      <rect x="0" y="324" width="840" height="86" rx="24" fill="#f1eadc"/>
      <circle cx="43" cy="367" r="23" fill="#10253f"/>
      <text class="sans number" x="34" y="376" font-size="25">4</text>
      <text class="sans body" x="90" y="378" font-size="32">No fake praise you cannot defend</text>
    </g>
  </g>

  <g transform="translate(710 154)">
    <rect x="0" y="0" width="328" height="88" rx="28" fill="#10253f" opacity="0.94"/>
    <text class="sans" x="34" y="37" font-size="24" font-weight="750" fill="#fffaf0">Draft cleaner.</text>
    <text class="sans" x="34" y="67" font-size="24" font-weight="750" fill="#f6c65b">Sound human.</text>
  </g>

  <g transform="translate(176 1060)">
    <rect x="0" y="-58" width="848" height="76" rx="38" fill="#10253f" opacity="0.92"/>
    <text class="sans" x="38" y="-11" font-size="28" font-weight="800" fill="#fffaf0">Use AI, then remove the robotic parts.</text>
  </g>
</svg>
