<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI interview rehearsal checklist</title>
  <desc id="desc">A World of Interns checklist card with four steps for using AI to rehearse internship interviews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="250" font-size="60" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">AI interview</text>
  <text x="80" y="320" font-size="60" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">rehearsal</text>
  <text x="80" y="372" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Use AI to find weak answers before the interview.</text>

  <rect x="80" y="450" width="1040" height="490" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <rect x="130" y="512" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 534 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="548" font-size="38" fill="#23303a" font-family="Arial, sans-serif">Paste real project notes</text>

  <rect x="130" y="620" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 642 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="656" font-size="38" fill="#23303a" font-family="Arial, sans-serif">Ask for gap questions</text>

  <rect x="130" y="728" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 750 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="764" font-size="38" fill="#23303a" font-family="Arial, sans-serif">Add one number or trade-off</text>

  <rect x="130" y="836" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 858 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="872" font-size="38" fill="#23303a" font-family="Arial, sans-serif">Say it out loud</text>

  <text x="600" y="1038" font-size="32" fill="#23303a" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">Practice should reveal what you still need to understand.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
