<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Resume project line before and after</title>
  <desc id="desc">A World of Interns visual showing how to rewrite a weak resume project line into a stronger proof-based line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="230" font-size="52" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Project lines need proof.</text>
  <text x="80" y="292" font-size="34" fill="#5c6773" font-family="Arial, sans-serif">Not just a project name.</text>

  <rect x="80" y="360" width="500" height="560" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <text x="330" y="430" font-size="30" fill="#c0492f" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">WEAK LINE</text>
  <line x1="130" y1="465" x2="530" y2="465" stroke="#d7cfbf" stroke-width="3"/>
  <text x="130" y="540" font-size="34" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">"Made a food delivery</text>
  <text x="130" y="586" font-size="34" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">website using React."</text>
  <text x="130" y="700" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">What is missing?</text>
  <text x="160" y="755" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">scope</text>
  <text x="160" y="808" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">feature detail</text>
  <text x="160" y="861" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">proof</text>
  <circle cx="132" cy="746" r="7" fill="#c0492f"/>
  <circle cx="132" cy="799" r="7" fill="#c0492f"/>
  <circle cx="132" cy="852" r="7" fill="#c0492f"/>

  <rect x="620" y="360" width="500" height="560" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <text x="870" y="430" font-size="30" fill="#2f7d4f" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">STRONG LINE</text>
  <line x1="670" y1="465" x2="1070" y2="465" stroke="#d7cfbf" stroke-width="3"/>
  <text x="670" y="535" font-size="31" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Built a React app with</text>
  <text x="670" y="580" font-size="31" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">cart, search, and admin</text>
  <text x="670" y="625" font-size="31" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">view; improved load time</text>
  <text x="670" y="670" font-size="31" fill="#23303a" font-weight="700" font-family="Georgia, 'Times New Roman', serif">after cleanup.</text>
  <text x="670" y="775" font-size="28" fill="#5c6773" font-family="Arial, sans-serif">Why it works:</text>
  <text x="700" y="830" font-size="28" fill="#23303a" font-family="Arial, sans-serif">built + tools + result</text>
  <text x="700" y="883" font-size="28" fill="#23303a" font-family="Arial, sans-serif">easy to ask about</text>
  <circle cx="672" cy="821" r="7" fill="#2f7d4f"/>
  <circle cx="672" cy="874" r="7" fill="#2f7d4f"/>

  <rect x="180" y="980" width="840" height="82" rx="18" fill="#23303a"/>
  <text x="600" y="1032" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Built [thing] using [tools] to solve [problem], with [proof].</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
