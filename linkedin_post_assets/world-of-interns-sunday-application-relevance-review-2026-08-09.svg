<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Sunday relevance review</title>
  <desc id="desc">A World of Interns checklist card with three checks: role fit, visible proof, and one gap to close before Monday applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#16304f" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1010" cy="190" r="170" fill="#d9ecff"/>
  <circle cx="165" cy="1010" r="220" fill="#d8f5ea"/>

  <rect x="105" y="110" width="990" height="980" rx="52" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="105" y="110" width="990" height="980" rx="52" fill="none" stroke="#d8e6f5" stroke-width="3"/>

  <text x="165" y="210" fill="#11345a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3">WORLD OF INTERNS</text>
  <rect x="165" y="250" width="870" height="3" fill="#dbe8f6"/>

  <text x="165" y="350" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">
    Sunday relevance
  </text>
  <text x="165" y="432" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">
    review
  </text>

  <text x="165" y="510" fill="#4b617d" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">
    Before Monday applications, check the signal.
  </text>

  <g transform="translate(165 595)">
    <rect x="0" y="0" width="870" height="118" rx="28" fill="#f4f9ff" stroke="#d7e7f8" stroke-width="2"/>
    <circle cx="58" cy="59" r="26" fill="#1f8f69"/>
    <path d="M45 59.5l8.5 8.5L72 49" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="51" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Role fit</text>
    <text x="112" y="91" fill="#526880" font-family="Inter, Arial, sans-serif" font-size="27">Can you name why this internship matches you?</text>
  </g>

  <g transform="translate(165 745)">
    <rect x="0" y="0" width="870" height="118" rx="28" fill="#f7fbf5" stroke="#d9ecd2" stroke-width="2"/>
    <circle cx="58" cy="59" r="26" fill="#1f8f69"/>
    <path d="M45 59.5l8.5 8.5L72 49" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="51" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Visible proof</text>
    <text x="112" y="91" fill="#526880" font-family="Inter, Arial, sans-serif" font-size="27">Is there a project, bullet, README, or portfolio line?</text>
  </g>

  <g transform="translate(165 895)">
    <rect x="0" y="0" width="870" height="118" rx="28" fill="#fff8ef" stroke="#f2dfc4" stroke-width="2"/>
    <circle cx="58" cy="59" r="26" fill="#d97706"/>
    <path d="M45 59.5l8.5 8.5L72 49" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="51" fill="#10233f" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">One gap to close</text>
    <text x="112" y="91" fill="#526880" font-family="Inter, Arial, sans-serif" font-size="27">Fix one weak signal before sending more applications.</text>
  </g>

  <text x="165" y="1060" fill="#6a7f98" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600">
    One relevant application with proof beats ten applications without signal.
  </text>
</svg>
