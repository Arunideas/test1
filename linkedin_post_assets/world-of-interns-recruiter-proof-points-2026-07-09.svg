<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="World of Interns recruiter scan proof checklist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#23303a" flood-opacity="0.14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <rect x="80" y="78" width="48" height="48" rx="11" fill="#0b5cff"/>
  <text x="104" y="111" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
  <text x="144" y="111" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#23303a">World of Interns</text>

  <rect x="70" y="178" width="1060" height="850" rx="34" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3" filter="url(#shadow)"/>
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0b5cff" letter-spacing="1">Recruiter scan</text>
  <text x="100" y="335" font-family="Georgia, Times New Roman, serif" font-size="72" font-weight="800" fill="#23303a">Show proof,</text>
  <text x="100" y="415" font-family="Georgia, Times New Roman, serif" font-size="72" font-weight="800" fill="#23303a">not adjectives.</text>

  
    <rect x="96" y="376" width="58" height="58" rx="12" fill="#fbf9f4" stroke="#23303a" stroke-width="4"/>
    <path d="M110 405 l15 17 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="408" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#23303a">Role match</text>
    <text x="180" y="452" font-family="Arial, sans-serif" font-size="27" fill="#5c6773">Can they see the internship fit?</text>

    <rect x="96" y="511" width="58" height="58" rx="12" fill="#fbf9f4" stroke="#23303a" stroke-width="4"/>
    <path d="M110 540 l15 17 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="543" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#23303a">Relevant project</text>
    <text x="180" y="587" font-family="Arial, sans-serif" font-size="27" fill="#5c6773">One project close to the work.</text>

    <rect x="96" y="646" width="58" height="58" rx="12" fill="#fbf9f4" stroke="#23303a" stroke-width="4"/>
    <path d="M110 675 l15 17 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="678" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#23303a">Finished proof</text>
    <text x="180" y="722" font-family="Arial, sans-serif" font-size="27" fill="#5c6773">A shipped, tested, or used outcome.</text>

    <rect x="96" y="781" width="58" height="58" rx="12" fill="#fbf9f4" stroke="#23303a" stroke-width="4"/>
    <path d="M110 810 l15 17 l31 -38" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="813" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#23303a">Clear result</text>
    <text x="180" y="857" font-family="Arial, sans-serif" font-size="27" fill="#5c6773">Numbers, users, time saved, or scope.</text>

  <line x1="100" y1="945" x2="1100" y2="945" stroke="#d7cfbf" stroke-width="3"/>
  <text x="100" y="1005" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#23303a">Before applying: highlight the first proof point they will see.</text>
  <text x="600" y="1134" font-family="Arial, sans-serif" font-size="23" fill="#5c6773" text-anchor="middle">worldofinterns.in  |  practical, not promotional</text>
</svg>
