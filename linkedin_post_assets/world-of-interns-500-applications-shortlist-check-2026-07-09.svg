<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">World of Interns recruiter shortlist card</title>
  <desc id="desc">A checklist card explaining what HR scans first when 500 internship applications arrive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e8e0d1"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#23303a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="76" width="48" height="48" rx="11" fill="#0b5cff"/>
    <text x="104" y="109" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="144" y="109" font-size="27" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="218" font-size="30" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Thursday Recruiter Insight</text>
  <text x="80" y="302" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">500 applications.</text>
  <text x="80" y="382" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">One first screen.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="468" width="1040" height="472" rx="26" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <text x="132" y="548" font-size="32" fill="#5c6773" font-weight="700" font-family="Arial, sans-serif">What HR tries to find fast</text>

    <g transform="translate(132 614)">
      <rect x="0" y="-32" width="44" height="44" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -12 l11 13 l24 -29" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="0" font-size="38" fill="#23303a" font-family="Arial, sans-serif">role-fit keywords</text>
    </g>

    <g transform="translate(132 716)">
      <rect x="0" y="-32" width="44" height="44" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -12 l11 13 l24 -29" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="0" font-size="38" fill="#23303a" font-family="Arial, sans-serif">one relevant proof point</text>
    </g>

    <g transform="translate(132 818)">
      <rect x="0" y="-32" width="44" height="44" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M10 -12 l11 13 l24 -29" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="0" font-size="38" fill="#23303a" font-family="Arial, sans-serif">finished work, not claims</text>
    </g>

    <line x1="690" y1="574" x2="690" y2="846" stroke="#d7cfbf" stroke-width="3"/>
    <text x="744" y="638" font-size="118" fill="#0b5cff" font-weight="800" font-family="Arial, sans-serif">7s</text>
    <text x="748" y="700" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">to decide whether</text>
    <text x="748" y="744" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">to keep reading</text>
  </g>

  <rect x="80" y="992" width="1040" height="3" fill="#d7cfbf"/>
  <text x="80" y="1062" font-size="30" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Make the story easy to scan.</text>
  <text x="80" y="1106" font-size="25" fill="#5c6773" font-family="Arial, sans-serif">worldofinterns.in - practical, not promotional</text>
</svg>
