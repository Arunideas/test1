<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fresher resume section order</title>
  <desc id="desc">Before and after resume section order card showing project proof moved above generic sections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e7dfcf"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#23303a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1060" cy="150" r="130" fill="#d8cfbd" opacity="0.35"/>
  <circle cx="120" cy="1040" r="170" fill="#d8cfbd" opacity="0.3"/>

  <g>
    <rect x="78" y="76" width="48" height="48" rx="11" fill="#0b5cff"/>
    <text x="102" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">W</text>
    <text x="144" y="109" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#23303a">World of Interns</text>
  </g>

  <text x="80" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="800" fill="#23303a">Your proof should not be</text>
  <text x="80" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="800" fill="#23303a">buried on page one.</text>
  <text x="82" y="330" font-family="Arial, sans-serif" font-size="25" fill="#5c6773">A better section order helps a recruiter find evidence in the first scan.</text>

  <g filter="url(#paperShadow)">
    <rect x="80" y="395" width="492" height="610" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <rect x="110" y="430" width="432" height="58" rx="12" fill="#fff4ef" stroke="#e4b3a7" stroke-width="2"/>
    <text x="326" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#c0492f">BEFORE: proof is low</text>

    <g font-family="Arial, sans-serif" font-size="28" fill="#23303a">
      <rect x="125" y="535" width="384" height="58" rx="12" fill="#f1eadf"/>
      <text x="150" y="573">Generic summary</text>
      <rect x="125" y="615" width="384" height="58" rx="12" fill="#f1eadf"/>
      <text x="150" y="653">Education details</text>
      <rect x="125" y="695" width="384" height="58" rx="12" fill="#f1eadf"/>
      <text x="150" y="733">Certificates list</text>
      <rect x="125" y="775" width="384" height="58" rx="12" fill="#f1eadf"/>
      <text x="150" y="813">Skills keyword wall</text>
      <rect x="125" y="855" width="384" height="58" rx="12" fill="#fde5dc" stroke="#c0492f" stroke-width="2"/>
      <text x="150" y="893" font-weight="700">Best project proof</text>
    </g>
  </g>

  <g filter="url(#paperShadow)">
    <rect x="628" y="395" width="492" height="610" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <rect x="658" y="430" width="432" height="58" rx="12" fill="#edf8f1" stroke="#9bc7a8" stroke-width="2"/>
    <text x="874" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#2f7d4f">AFTER: proof is visible</text>

    <g font-family="Arial, sans-serif" font-size="28" fill="#23303a">
      <rect x="673" y="535" width="384" height="58" rx="12" fill="#e8f1ff" stroke="#0b5cff" stroke-width="2"/>
      <text x="698" y="573" font-weight="700">Target role headline</text>
      <rect x="673" y="615" width="384" height="58" rx="12" fill="#e8f1ff" stroke="#0b5cff" stroke-width="2"/>
      <text x="698" y="653" font-weight="700">2 relevant projects</text>
      <rect x="673" y="695" width="384" height="58" rx="12" fill="#edf8f1" stroke="#2f7d4f" stroke-width="2"/>
      <text x="698" y="733" font-weight="700">Skills backed by proof</text>
      <rect x="673" y="775" width="384" height="58" rx="12" fill="#f1eadf"/>
      <text x="698" y="813">Education basics</text>
      <rect x="673" y="855" width="384" height="58" rx="12" fill="#f1eadf"/>
      <text x="698" y="893">Relevant certificates</text>
    </g>
  </g>

  <g>
    <rect x="225" y="1038" width="750" height="70" rx="35" fill="#23303a"/>
    <text x="600" y="1083" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Page one should answer: is there enough proof to keep reading?</text>
  </g>

  <text x="600" y="1160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#5c6773">worldofinterns.in  -  practical, not promotional</text>
</svg>
