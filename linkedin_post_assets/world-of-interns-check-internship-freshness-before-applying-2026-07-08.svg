<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Check internship freshness before applying</title>
  <desc id="desc">A World of Interns checklist card showing four signals to check before applying to an internship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="265" font-size="54" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Before you apply,</text>
  <text x="80" y="330" font-size="54" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">check if the listing is alive.</text>

  <rect x="80" y="405" width="1040" height="520" rx="26" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <rect x="130" y="466" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 486 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="500" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Posted date</text>

  <rect x="130" y="576" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 596 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="610" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Deadline or timeline</text>

  <rect x="130" y="686" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 706 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="720" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Recent company activity</text>

  <rect x="130" y="796" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 816 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="830" font-size="38" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">"Closed" or "filled" comments</text>

  <text x="80" y="1005" font-size="34" fill="#5c6773" font-family="Arial, sans-serif">2 minutes now can save a wasted application later.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
