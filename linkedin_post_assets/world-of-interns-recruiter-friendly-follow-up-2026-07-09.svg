<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Recruiter-friendly follow-up</title>
  <desc id="desc">World of Interns card showing a recruiter-friendly follow-up structure: context, proof, and one clear question.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="250" font-size="58" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">A follow-up recruiters</text>
  <text x="80" y="320" font-size="58" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">can process quickly.</text>
  <text x="82" y="373" font-size="30" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Give context, one proof point, and one clear next-step question.</text>

  <rect x="80" y="455" width="1040" height="126" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <circle cx="145" cy="518" r="34" fill="#0b5cff"/>
  <text x="145" y="531" font-size="36" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="205" y="511" font-size="34" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Context</text>
  <text x="205" y="552" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Role name + when you applied or interviewed.</text>

  <rect x="80" y="620" width="1040" height="126" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <circle cx="145" cy="683" r="34" fill="#0b5cff"/>
  <text x="145" y="696" font-size="36" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="205" y="676" font-size="34" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Proof point</text>
  <text x="205" y="717" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">One line that connects your work to the role.</text>

  <rect x="80" y="785" width="1040" height="126" rx="22" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <circle cx="145" cy="848" r="34" fill="#0b5cff"/>
  <text x="145" y="861" font-size="36" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="205" y="841" font-size="34" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Clear question</text>
  <text x="205" y="882" font-size="26" fill="#5c6773" font-family="Arial, sans-serif">Ask about the next step, not a vague update.</text>

  <rect x="80" y="980" width="1040" height="72" rx="16" fill="#23303a"/>
  <text x="600" y="1027" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Useful follow-up is short, specific, and easy to route.</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
