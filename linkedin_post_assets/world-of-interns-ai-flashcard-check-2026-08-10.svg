<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI flashcard check before interviews</title>
  <desc id="desc">A World of Interns checklist card showing four steps for using AI to make interview flashcards from lecture notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#paper-grain)" opacity="0.08"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <g transform="rotate(-2 610 625)" filter="url(#soft-shadow)">
    <rect x="165" y="210" width="870" height="790" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="4"/>
    <line x1="225" y1="340" x2="975" y2="340" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="225" y1="500" x2="975" y2="500" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="225" y1="660" x2="975" y2="660" stroke="#d7cfbf" stroke-width="3"/>
    <line x1="225" y1="820" x2="975" y2="820" stroke="#d7cfbf" stroke-width="3"/>
  </g>

  <text x="215" y="275" font-size="26" fill="#5c6773" font-family="Arial, sans-serif" font-weight="700" letter-spacing="3">MONDAY AI TOOL</text>
  <text x="215" y="360" font-size="58" fill="#23303a" font-family="Georgia, 'Times New Roman', serif" font-weight="800">AI flashcard check</text>
  <text x="215" y="430" font-size="58" fill="#23303a" font-family="Georgia, 'Times New Roman', serif" font-weight="800">before interviews</text>

  <g font-family="Arial, sans-serif" fill="#23303a">
    <g transform="translate(225 540)">
      <rect x="0" y="-36" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -14 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="0" font-size="38" font-family="Georgia, 'Times New Roman', serif">Paste one page of your notes</text>
    </g>
    <g transform="translate(225 670)">
      <rect x="0" y="-36" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -14 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="0" font-size="38" font-family="Georgia, 'Times New Roman', serif">Ask for 10 interview questions</text>
    </g>
    <g transform="translate(225 800)">
      <rect x="0" y="-36" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -14 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="0" font-size="38" font-family="Georgia, 'Times New Roman', serif">Answer before viewing AI's answer</text>
    </g>
    <g transform="translate(225 930)">
      <rect x="0" y="-36" width="48" height="48" rx="9" fill="none" stroke="#23303a" stroke-width="4"/>
      <path d="M11 -14 l12 14 l28 -34" fill="none" stroke="#2f7d4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="0" font-size="38" font-family="Georgia, 'Times New Roman', serif">Verify weak spots from the source</text>
    </g>
  </g>

  <g transform="translate(820 195) rotate(6)">
    <rect x="0" y="0" width="205" height="118" rx="16" fill="#ffffff" stroke="#d7cfbf" stroke-width="3"/>
    <text x="102" y="50" font-size="24" fill="#0b5cff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Use AI</text>
    <text x="102" y="84" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">like a mirror</text>
  </g>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  |  practical, not promotional</text>
</svg>
