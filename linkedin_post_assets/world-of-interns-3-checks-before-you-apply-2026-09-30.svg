<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="World of Interns checklist visual: 3 checks before you apply to an internship listing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="270" font-size="66" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">3 checks before</text>
  <text x="80" y="350" font-size="66" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">you apply</text>
  <text x="80" y="420" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">Read the listing like a shortlist filter.</text>

  <g>
    <circle cx="125" cy="560" r="42" fill="#0b5cff"/>
    <text x="125" y="575" font-size="44" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="195" y="548" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Work</text>
    <text x="195" y="600" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">Clear tasks, not just a title</text>
  </g>

  <g>
    <circle cx="125" cy="730" r="42" fill="#0b5cff"/>
    <text x="125" y="745" font-size="44" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="195" y="718" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Review</text>
    <text x="195" y="770" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">A mentor or reporting manager</text>
  </g>

  <g>
    <circle cx="125" cy="900" r="42" fill="#0b5cff"/>
    <text x="125" y="915" font-size="44" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="195" y="888" font-size="42" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">Proof</text>
    <text x="195" y="940" font-size="30" fill="#5c6773" font-family="Arial, sans-serif">An outcome you can show later</text>
  </g>

  <rect x="760" y="500" width="320" height="420" rx="18" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <line x1="800" y1="585" x2="1040" y2="585" stroke="#d7cfbf" stroke-width="8" stroke-linecap="round"/>
  <line x1="800" y1="660" x2="1000" y2="660" stroke="#d7cfbf" stroke-width="8" stroke-linecap="round"/>
  <line x1="800" y1="735" x2="1030" y2="735" stroke="#d7cfbf" stroke-width="8" stroke-linecap="round"/>
  <line x1="800" y1="810" x2="960" y2="810" stroke="#d7cfbf" stroke-width="8" stroke-linecap="round"/>
  <path d="M870 930 l70 -110 l70 110" fill="none" stroke="#c0492f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="920" y="980" font-size="26" fill="#c0492f" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Verify first</text>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
