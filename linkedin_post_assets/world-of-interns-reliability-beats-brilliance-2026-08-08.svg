<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Reliability beats brilliance</title>
  <desc id="desc">A World of Interns checklist card with four habits for first-time interns: Confirm, Update, Flag, and Close.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e7dfd1"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="250" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">Reliability beats</text>
  <text x="80" y="330" font-size="66" fill="#23303a" font-weight="800" font-family="Georgia, 'Times New Roman', serif">brilliance</text>
  <rect x="80" y="375" width="285" height="8" rx="4" fill="#0b5cff"/>

  <g>
    <rect x="80" y="455" width="1040" height="116" rx="20" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="140" cy="513" r="28" fill="#0b5cff"/>
    <text x="140" y="524" font-size="31" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">1</text>
    <text x="190" y="500" font-size="31" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Confirm</text>
    <text x="190" y="542" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Repeat the task in your own words</text>
  </g>

  <g>
    <rect x="80" y="600" width="1040" height="116" rx="20" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="140" cy="658" r="28" fill="#0b5cff"/>
    <text x="140" y="669" font-size="31" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">2</text>
    <text x="190" y="645" font-size="31" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Update</text>
    <text x="190" y="687" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Share progress before being asked</text>
  </g>

  <g>
    <rect x="80" y="745" width="1040" height="116" rx="20" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="140" cy="803" r="28" fill="#0b5cff"/>
    <text x="140" y="814" font-size="31" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">3</text>
    <text x="190" y="790" font-size="31" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Flag</text>
    <text x="190" y="832" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Raise blockers early, with context</text>
  </g>

  <g>
    <rect x="80" y="890" width="1040" height="116" rx="20" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
    <circle cx="140" cy="948" r="28" fill="#0b5cff"/>
    <text x="140" y="959" font-size="31" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">4</text>
    <text x="190" y="935" font-size="31" fill="#0b5cff" font-weight="700" font-family="Arial, sans-serif">Close</text>
    <text x="190" y="977" font-size="34" fill="#23303a" font-family="Georgia, 'Times New Roman', serif">Tell the team when the task is done</text>
  </g>

  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
