<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Work alongside AI</title>
  <desc id="desc">World of Interns checklist card about using AI with judgement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>

  <text x="80" y="270" font-size="68" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Work alongside AI</text>
  <text x="80" y="338" font-size="38" fill="#5c6773" font-weight="600" font-family="Arial, sans-serif">without outsourcing your thinking</text>

  <rect x="80" y="405" width="1040" height="520" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <rect x="130" y="482" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 504 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="516" font-size="42" fill="#23303a" font-family="Arial, sans-serif">Ask a better question</text>

  <rect x="130" y="592" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 614 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="626" font-size="42" fill="#23303a" font-family="Arial, sans-serif">Check against a source</text>

  <rect x="130" y="702" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 724 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="736" font-size="42" fill="#23303a" font-family="Arial, sans-serif">Rewrite the weak part</text>

  <rect x="130" y="812" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
  <path d="M140 834 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="846" font-size="42" fill="#23303a" font-family="Arial, sans-serif">Explain your decision</text>

  <rect x="80" y="980" width="1040" height="4" fill="#0b5cff" opacity="0.75"/>
  <text x="600" y="1072" font-size="24" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in | practical, not promotional</text>
</svg>
