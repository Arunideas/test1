<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI interview prep brief checklist</title>
  <desc id="desc">A World of Interns checklist card showing how to convert a long company report into an interview prep brief.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.06"/>

  <g>
    <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
    <text x="103" y="112" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">W</text>
    <text x="140" y="112" font-size="26" fill="#23303a" font-weight="700" font-family="Arial, sans-serif">World of Interns</text>
  </g>

  <text x="80" y="238" font-size="56" fill="#23303a" font-weight="800" font-family="Arial, sans-serif">Use AI for interview prep</text>
  <text x="80" y="304" font-size="40" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Turn a long report into a 10-minute brief.</text>

  <rect x="80" y="380" width="1040" height="560" rx="28" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <rect x="130" y="450" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 471 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="205" y="482" font-size="36" fill="#23303a" font-weight="700">5 business points to understand</text>

    <rect x="130" y="570" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 591 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="205" y="602" font-size="36" fill="#23303a" font-weight="700">Repeated company words</text>

    <rect x="130" y="690" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 711 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="205" y="722" font-size="36" fill="#23303a" font-weight="700">Likely interview questions</text>

    <rect x="130" y="810" width="44" height="44" rx="8" fill="none" stroke="#23303a" stroke-width="4"/>
    <path d="M140 831 l12 14 l24 -30" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round"/>
    <text x="205" y="842" font-size="36" fill="#23303a" font-weight="700">Resume proof for each answer</text>
  </g>

  <text x="80" y="1015" font-size="30" fill="#5c6773" font-family="Georgia, 'Times New Roman', serif">Do not copy the AI. Use it to prepare better questions.</text>
  <text x="600" y="1130" font-size="22" fill="#5c6773" text-anchor="middle" font-family="Arial, sans-serif">worldofinterns.in  -  practical, not promotional</text>
</svg>
