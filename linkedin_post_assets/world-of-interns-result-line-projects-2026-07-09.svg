<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="A World of Interns comparison card titled Add the result line, showing a project bullet before and after adding context about who used it, what changed, and what became easier.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.08"/>

  <rect x="80" y="80" width="46" height="46" rx="10" fill="#0b5cff"/>
  <text x="103" y="112" font-size="26" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">W</text>
  <text x="140" y="112" font-size="26" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">World of Interns</text>

  <text x="80" y="238" font-size="74" font-weight="800" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">ADD THE</text>
  <text x="80" y="324" font-size="74" font-weight="800" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">RESULT LINE</text>
  <text x="84" y="386" font-size="32" font-weight="400" fill="#5c6773" font-family="Georgia, serif" text-anchor="start">A project bullet should answer: what changed?</text>

  <rect x="80" y="455" width="480" height="460" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>
  <rect x="640" y="455" width="480" height="460" rx="24" fill="#fbf9f4" stroke="#d7cfbf" stroke-width="3"/>

  <text x="320" y="525" font-size="34" font-weight="800" fill="#c0492f" font-family="Arial, sans-serif" text-anchor="middle">BEFORE</text>
  <text x="880" y="525" font-size="34" font-weight="800" fill="#2f7d4f" font-family="Arial, sans-serif" text-anchor="middle">AFTER</text>

  <line x1="130" y1="565" x2="510" y2="565" stroke="#d7cfbf" stroke-width="3"/>
  <line x1="690" y1="565" x2="1070" y2="565" stroke="#d7cfbf" stroke-width="3"/>

  <circle cx="132" cy="650" r="9" fill="#5c6773"/>
  <text x="160" y="640" font-size="30" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">Built a dashboard</text>
  <text x="160" y="682" font-size="30" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">using React and</text>
  <text x="160" y="724" font-size="30" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">Node.js.</text>

  <circle cx="692" cy="632" r="9" fill="#0b5cff"/>
  <text x="720" y="622" font-size="29" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">Built a dashboard</text>
  <text x="720" y="662" font-size="29" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">for a college club</text>
  <text x="720" y="702" font-size="29" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">that reduced tracking</text>
  <text x="720" y="742" font-size="29" font-weight="700" fill="#23303a" font-family="Arial, sans-serif" text-anchor="start">from 2 hours to 20 min.</text>

  <rect x="125" y="800" width="390" height="56" rx="14" fill="#efe7db"/>
  <text x="320" y="837" font-size="24" font-weight="700" fill="#5c6773" font-family="Arial, sans-serif" text-anchor="middle">Tool named, context missing</text>

  <rect x="685" y="800" width="390" height="56" rx="14" fill="#e4f0e8"/>
  <text x="880" y="837" font-size="24" font-weight="700" fill="#2f7d4f" font-family="Arial, sans-serif" text-anchor="middle">Tool + user + result</text>

  <rect x="80" y="960" width="1040" height="86" rx="18" fill="#23303a" opacity="0.95"/>
  <text x="600" y="1015" font-size="32" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">Who used it? What changed? What became easier?</text>

  <text x="600" y="1130" font-size="22" font-weight="400" fill="#5c6773" font-family="Arial, sans-serif" text-anchor="middle">worldofinterns.in  -  practical, not promotional</text>
</svg>
