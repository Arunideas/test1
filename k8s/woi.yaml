# World of Interns — Kubernetes manifest for Portainer GitOps
# ("Create from manifest" → Deploy from a Git repository, path: k8s/woi.yaml).
#
# IMPORTANT:
#  - This manifest is namespace-agnostic on purpose. Portainer injects the
#    namespace you select in the deploy form, so do NOT add `namespace:` fields
#    here (Portainer rejects manifests whose namespace differs from the form).
#    Create/select the target namespace (e.g. "woi") in Portainer first.
#  - Single instance only: the app uses a JSON file store + an in-process
#    scheduler, so keep replicas: 1 and strategy: Recreate.
#  - The env Secret ("woi-secrets") is intentionally NOT in this Git-managed
#    file, so GitOps auto-sync never overwrites your OPENAI_API_KEY. Create it
#    once (in the same namespace) from k8s/secret.example.yaml.
#  - If the GHCR image is PRIVATE, create a pull secret "ghcr-cred" and
#    uncomment imagePullSecrets in the Deployment below.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woi-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # k3s ships the "local-path" default StorageClass; leave this unset to use it,
  # or set storageClassName explicitly if your cluster differs.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woi-content
  labels:
    app: woi-content
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: woi-content
  template:
    metadata:
      labels:
        app: woi-content
    spec:
      # If the GHCR package is PRIVATE, create a pull secret named "ghcr-cred"
      # and uncomment the next two lines:
      # imagePullSecrets:
      #   - name: ghcr-cred
      containers:
        - name: woi-content
          image: ghcr.io/arunideas/test1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            # Created out-of-band (not via GitOps) so your API key isn't wiped
            # on sync. optional:true lets the pod start before it exists.
            - secretRef:
                name: woi-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/meta
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/meta
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: woi-data
---
apiVersion: v1
kind: Service
metadata:
  name: woi-content
  labels:
    app: woi-content
spec:
  type: NodePort
  selector:
    app: woi-content
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      # Access at http://<any-node-ip>:30080
      nodePort: 30080
