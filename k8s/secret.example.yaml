# Create this ONCE, out-of-band from GitOps, so auto-sync never overwrites your
# API key. Fill in OPENAI_API_KEY, then apply it via Portainer
# (Applications → Create from manifest → Web editor) or kubectl.
#
# Do NOT connect this file to GitOps and do NOT commit real secret values.
apiVersion: v1
kind: Secret
metadata:
  name: woi-secrets
  namespace: woi
type: Opaque
stringData:
  # Required — writing is AI-only.
  OPENAI_API_KEY: "sk-REPLACE_ME"
  OPENAI_TEXT_MODEL: "gpt-4o-mini"
  OPENAI_IMAGE_MODEL: "gpt-image-1"
  # Optional — real LinkedIn publishing (leave blank for simulation mode).
  LINKEDIN_ACCESS_TOKEN: ""
  LINKEDIN_AUTHOR_URN: ""
  # Optional — protects the scheduled pipeline endpoint /api/cron/run.
  CRON_SECRET: ""
